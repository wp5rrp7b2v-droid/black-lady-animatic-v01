name: P03 N14 Reference Delivery Bundle V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n14-reference-delivery-bundle-v001.yml"

permissions:
  contents: read

jobs:
  build-delivery-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify canonical N14 references and build bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, struct

          ROOT = pathlib.Path.cwd().resolve()
          SOURCE_COMMIT = os.environ["SOURCE_COMMIT"]
          BUNDLE_ID = "N14_REFERENCE_DELIVERY_BUNDLE_V001"
          OUT = ROOT / BUNDLE_ID
          VISUAL = OUT / "visual_refs"
          CONTINUITY = OUT / "continuity_refs"
          REGISTRY_PATH = ROOT / "production/asset_registry/asset_registry.jsonl"
          STORY_INDEX_PATH = ROOT / "production/story_shots/story_shot_index.jsonl"

          ASSETS = {
              "AST_IMG_000034": {
                  "entity_id": "CHAR_NING_QIUSHUI", "role": "FACE_FRONT",
                  "authority_class": "MASTER", "resolver_usage": "DEFAULT",
                  "approval_status": "APPROVED", "lifecycle": "CURRENT",
                  "sha256": "5d62423ef9f1abcd349a3736079c77f3f56416cade8991a966fd925e5817ec8c",
                  "byte_size": 2613947,
                  "path": "production/image_library/character_references/ning_qiushui/CHAR_NING_QIUSHUI_FACE_FRONT_DEFAULT_DEFAULT_V001.png",
                  "git_blob_sha": "58663e76c353918025736064c7e25741f51e4864",
                  "responsibility": "NING_FACE_IDENTITY_AUTHORITY",
              },
              "AST_IMG_000032": {
                  "entity_id": "CHAR_NING_QIUSHUI", "role": "BODY_FRONT",
                  "authority_class": "MASTER", "resolver_usage": "DEFAULT",
                  "approval_status": "APPROVED", "lifecycle": "CURRENT",
                  "sha256": "c1c63f7d2548035da30133a45bc2e051093289494e672fe930e20104a48e8117",
                  "byte_size": 2616286,
                  "path": "production/image_library/character_references/ning_qiushui/CHAR_NING_QIUSHUI_BODY_FRONT_DEFAULT_DEFAULT_V001.png",
                  "git_blob_sha": "bb05d1cabbc5b2ba26d53bfde73f214a8cdd4234",
                  "responsibility": "NING_BODY_COSTUME_STRUCTURE_AUTHORITY",
              },
              "AST_IMG_000026": {
                  "entity_id": "CHAR_NEIL", "role": "BODY_FRONT",
                  "authority_class": "MASTER", "resolver_usage": "DEFAULT",
                  "approval_status": "APPROVED", "lifecycle": "CURRENT",
                  "sha256": "f78ccfc252d2ed0cb31117ce1dae4c84893c5e52611a27fac161c8e6d014cf3d",
                  "byte_size": 2605161,
                  "path": "production/image_library/character_references/neil/CHAR_NEIL_BODY_FRONT_DEFAULT_DEFAULT_V001.png",
                  "git_blob_sha": "59939fba0a02b9364dbdc2d9ff8203fb57efa7f4",
                  "responsibility": "NEIL_SECONDARY_REFERENT_AUTHORITY",
              },
              "AST_IMG_000052": {
                  "entity_id": "SCENE_CASTLE_ENTRANCE", "role": "SCENE_MASTER",
                  "authority_class": "MASTER", "resolver_usage": "CONDITIONAL",
                  "approval_status": "APPROVED", "lifecycle": "CURRENT",
                  "sha256": "d49af6a5e42d0867f2ffe4883e6af82f4d3777da3e96d788924cee2a9c743961",
                  "byte_size": 2305753,
                  "path": "production/image_library/scene_masters/castle_entrance/SCENE_CASTLE_ENTRANCE_SCENE_MASTER_DEFAULT_DAY_DOOR_OPEN_V001.png",
                  "git_blob_sha": "e4dafe096f5c5c8782257030a5a659aeec7808f9",
                  "responsibility": "SCENE_FACT_AUTHORITY",
              },
          }

          A04 = {
              "approval_status": "APPROVED",
              "lifecycle": "CURRENT",
              "byte_size": 2486659,
              "path": "production/image_library/approved/A_Series/A04_REBOOT_approved_v001.png",
              "git_blob_sha": "fd05cae8618d7daa16c16658b29d25ab65052fbb",
              "responsibility": "IMMEDIATE_PREVIOUS_SHOT_CONTINUITY",
          }

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def git_blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def png_dimensions(data):
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              return struct.unpack(">II", data[16:24])

          def require_file(path):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Missing or redirected canonical binary: {path}")
              if path.resolve() != path:
                  raise SystemExit(f"Canonical path resolution mismatch: {path}")

          if OUT.exists() or OUT.is_symlink():
              raise SystemExit(f"Refusing to overwrite bundle path: {OUT}")
          VISUAL.mkdir(parents=True)
          CONTINUITY.mkdir()

          registry_rows = [
              json.loads(line)
              for line in REGISTRY_PATH.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          story_rows = [
              json.loads(line)
              for line in STORY_INDEX_PATH.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          refs = []

          # A04 immediate continuity first.
          rows = [row for row in story_rows if row.get("shot_id") == "A04"]
          if len(rows) != 1:
              raise SystemExit(f"A04 Story Shot index cardinality mismatch: {len(rows)}")
          row = rows[0]
          checks = {
              "approval_status": row.get("approval_status") == A04["approval_status"],
              "lifecycle": row.get("lifecycle") == A04["lifecycle"],
              "canonical_path": row.get("canonical_path") == A04["path"],
              "byte_size": row.get("byte_size") == A04["byte_size"],
              "github_blob_sha": row.get("github_blob_sha") == A04["git_blob_sha"],
          }
          if not all(checks.values()):
              raise SystemExit(f"A04 Story Shot index validation failed: {checks}")

          src = ROOT / A04["path"]
          require_file(src)
          data = src.read_bytes()
          actual_sha = sha256_bytes(data)
          actual_blob = git_blob_sha(data)
          width, height = png_dimensions(data)
          if len(data) != A04["byte_size"] or actual_blob != A04["git_blob_sha"]:
              raise SystemExit("A04 binary identity mismatch")

          dst = CONTINUITY / f"A04__{src.name}"
          shutil.copyfile(src, dst)
          if dst.read_bytes() != data:
              raise SystemExit("A04 byte-identical copy failed")

          refs.append({
              "asset_id": None,
              "shot_id": "A04",
              "role": "STORY_SHOT_CONTINUITY",
              "responsibility": A04["responsibility"],
              "authority_class": "CONTINUITY",
              "approval_status": A04["approval_status"],
              "lifecycle": A04["lifecycle"],
              "canonical_path": A04["path"],
              "filename": src.name,
              "bundle_path": dst.relative_to(OUT).as_posix(),
              "sha256": actual_sha,
              "sha256_identity_mode": "COMPUTED_FROM_LOCKED_PATH_SIZE_GIT_BLOB",
              "byte_size": len(data),
              "git_blob_sha": actual_blob,
              "width": width,
              "height": height,
              "source_commit": SOURCE_COMMIT,
          })

          for aid, exp in ASSETS.items():
              rows = [row for row in registry_rows if row.get("asset_id") == aid]
              if len(rows) != 1:
                  raise SystemExit(f"{aid} registry cardinality mismatch: {len(rows)}")
              row = rows[0]
              checks = {
                  "entity_id": row.get("entity_id") == exp["entity_id"],
                  "role": row.get("role") == exp["role"],
                  "authority_class": row.get("authority_class") == exp["authority_class"],
                  "resolver_usage": row.get("resolver_usage") == exp["resolver_usage"],
                  "approval_status": row.get("approval_status") == exp["approval_status"],
                  "lifecycle": row.get("lifecycle") == exp["lifecycle"],
                  "sha256": row.get("sha256") == exp["sha256"],
                  "byte_size": row.get("byte_size") == exp["byte_size"],
                  "storage_uri": row.get("storage_uri") == exp["path"],
              }
              if not all(checks.values()):
                  raise SystemExit(f"{aid} registry validation failed: {checks}")

              src = ROOT / exp["path"]
              require_file(src)
              data = src.read_bytes()
              actual_sha = sha256_bytes(data)
              actual_blob = git_blob_sha(data)
              width, height = png_dimensions(data)
              if actual_sha != exp["sha256"] or len(data) != exp["byte_size"] or actual_blob != exp["git_blob_sha"]:
                  raise SystemExit(f"{aid} binary identity mismatch")

              dst = VISUAL / f"{aid}__{src.name}"
              shutil.copyfile(src, dst)
              if dst.read_bytes() != data:
                  raise SystemExit(f"{aid} byte-identical copy failed")

              refs.append({
                  "asset_id": aid,
                  "shot_id": None,
                  "role": exp["role"],
                  "responsibility": exp["responsibility"],
                  "authority_class": exp["authority_class"],
                  "approval_status": exp["approval_status"],
                  "lifecycle": exp["lifecycle"],
                  "canonical_path": exp["path"],
                  "filename": src.name,
                  "bundle_path": dst.relative_to(OUT).as_posix(),
                  "sha256": actual_sha,
                  "byte_size": len(data),
                  "git_blob_sha": actual_blob,
                  "width": width,
                  "height": height,
                  "source_commit": SOURCE_COMMIT,
              })

          if len(refs) != 5:
              raise SystemExit(f"Reference count mismatch: {len(refs)}")

          manifest = {
              "bundle_id": BUNDLE_ID,
              "working_shot_id": "N14",
              "target_candidate": "N14_CANDIDATE_01",
              "source_commit": SOURCE_COMMIT,
              "reference_count": 5,
              "reference_policy": "MINIMUM_CANONICAL_REFERENCES",
              "authority_precedence": [
                  "A04_IMMEDIATE_PREVIOUS_SHOT_CONTINUITY",
                  "NING_FACE_IDENTITY_AUTHORITY",
                  "NING_BODY_COSTUME_STRUCTURE_AUTHORITY",
                  "NEIL_SECONDARY_REFERENT_AUTHORITY",
                  "SCENE_FACT_AUTHORITY",
                  "DIRECTOR_NARRATIVE_LOCK_FIRST_ENCOUNTER_IMPORTANCE",
              ],
              "excluded_references": [
                  "N11_UNPUBLISHED_FINAL_CANDIDATE",
                  "N12_UNPUBLISHED_FINAL_CANDIDATE",
                  "N13_REJECTED_CANDIDATE",
                  "N13_REFERENCE_DELIVERY_BUNDLE_V001",
                  "A05_NO_KEYS_REVEAL_SHOT",
                  "N15_FUTURE_REASONING_BEAT",
                  "ALL_KEY_WAIST_POCKET_LOCK_SYMBOLISM",
                  "ALL_REJECTED_OR_SUPERSEDED_CANDIDATES",
              ],
              "manual_product_owner_reference_upload": 0,
              "director_lock": {
                  "shot_type": "TIGHT_OR_MEDIUM_CLOSE_UP_ANALYTICAL_REACTION",
                  "primary_subject": "NING_QIUSHUI",
                  "psychological_state": "CALM_EXPERIENCED_ANALYTICAL_PATTERN_RECOGNITION",
                  "gaze": "DIRECTED_TOWARD_NEIL",
                  "depth_of_field": "SHALLOW",
                  "neil_presence": "SOFT_OUT_OF_FOCUS_SHOULDER_OR_SILHOUETTE_ONLY",
                  "background": "SOFT_SUBORDINATE_CASTLE_ENTRANCE",
                  "forbid_two_person_publicity_portrait": True,
                  "forbid_speaking_or_thinking_gestures": True,
                  "forbid_keys_waist_pockets_locks": True,
                  "forbid_key_holder_inference": True,
                  "n15_owns_specific_butler_key_holder_inference": True,
              },
              "references": refs,
              "overall_result": "PASS",
          }

          (OUT / "delivery_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          (OUT / "WORK_HANDOFF.md").write_text(
              "# N14 Reference Delivery Bundle V001\n\n"
              "Purpose: formal binary transport for N14｜First-Encounter Importance｜Candidate 01 generation.\n\n"
              "Director lock:\n"
              "- Generate exactly one N14 Candidate 01.\n"
              "- 9:16 vertical; tight / medium close-up analytical reaction.\n"
              "- Ning Qiushui is the clear and dominant primary subject.\n"
              "- Use shallow depth of field.\n"
              "- Ning looks toward Neil with calm, focused, experienced attention; this is quiet pattern recognition, not theatrical thinking.\n"
              "- Minimal facial change: concentrated eyes, quiet jaw, relaxed mouth; no dramatic frown, fear, surprise or visible aha gesture.\n"
              "- Neil may appear only as a soft out-of-focus dark-suited shoulder, silhouette or edge presence; he must not become the subject.\n"
              "- Other guests may be soft and subordinate.\n"
              "- Background architecture remains subdued.\n"
              "- No speaking, hand gesture, chin-touching, folded-arm detective pose or exaggerated suspense acting.\n"
              "- No keys, waist emphasis, pocket emphasis, locks or key-holder symbolism.\n"
              "- Do not visually state 'butler = key holder'; N15 owns that inference.\n"
              "- A04 provides immediate gaze / observation continuity, but do not copy A04 composition. N14 must feel tighter and more psychologically internal.\n"
              "- Do not use N11, N12, N13, A05, N15 or any rejected/superseded candidate as generation references.\n\n"
              "Validation:\n"
              "1. Revalidate all 5 PNGs against delivery_manifest.json before generation.\n"
              "2. Do not re-encode, resize, screenshot, rename or modify reference PNGs.\n"
              "3. If any reference fails SHA/byte/blob verification, fail closed.\n"
              "4. Product Owner manual reference upload count = 0.\n"
              "5. This artifact is transport evidence only, not a formal Asset.\n",
              encoding="utf-8",
          )

          for ref in refs:
              delivered = OUT / ref["bundle_path"]
              data = delivered.read_bytes()
              if (
                  sha256_bytes(data) != ref["sha256"]
                  or len(data) != ref["byte_size"]
                  or git_blob_sha(data) != ref["git_blob_sha"]
              ):
                  raise SystemExit(f"Final bundle revalidation failed: {ref['canonical_path']}")

          print("PASS: 5/5 exact canonical reference binaries verified")
          for ref in refs:
              print(f"{ref.get('asset_id') or ref.get('shot_id')} SHA256={ref['sha256']} BYTES={ref['byte_size']} BLOB={ref['git_blob_sha']}")
          print(f"BUNDLE_ID={BUNDLE_ID}")
          print(f"SOURCE_COMMIT={SOURCE_COMMIT}")
          PY

      - name: Upload N14 reference delivery artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: N14_REFERENCE_DELIVERY_BUNDLE_V001
          path: N14_REFERENCE_DELIVERY_BUNDLE_V001/
          retention-days: 7
          if-no-files-found: error

      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
