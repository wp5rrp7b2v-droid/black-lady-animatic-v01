name: Project Control Dashboard R167 Patch

on:
  push:
    branches: [main]
    paths:
      - "production/control_requests/dashboard_r167_patch.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dashboard to R167
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("docs/project_control/dashboard/dashboard.html")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ("Project Dashboard V101", "Project Dashboard V102"),
              ("Derived from R166 · Updated 2026-10-01", "Derived from R167 · Updated 2026-10-01"),
              ("P0.3｜S02-B ACTIVE｜Style Reference 已正式发布", "P0.3｜S02-B ACTIVE｜N21 V004 Design 已锁定"),
              ("Character Visual Style Reference V001 已 Product Owner 批准、canonical publication、远端 exact-binary verification PASS。下一步设计 CONTROLLED_REFERENCE delivery + N21 Bundle V004；Candidate 05 仍未授权.",
               "CONTROLLED_REFERENCE Delivery Support + N21 Bundle V004 Design V0.1 已 Product Owner 批准并锁定。下一步等待 Builder Support + V004 Spec / Build Preparation 授权；Candidate 05 仍未授权。"),
              ("N21 Bundle V004 Design NEXT", "V004 Implementation Authorization NEXT"),
              ("恢复点：CONTROLLED_REFERENCE Delivery Support + N21 Bundle V004 Design；Candidate 05 未授权。",
               "恢复点：授权 CONTROLLED_REFERENCE Builder Support + N21 Bundle V004 Spec / Build Preparation；Candidate 05 未授权。"),
              ("Next：CONTROLLED_REFERENCE delivery support + N21 Bundle V004 Design；Candidate 05 与 N22 均不启动。",
               "Next：等待 CONTROLLED_REFERENCE Builder Support + N21 Bundle V004 Spec / Build Preparation 授权；Candidate 05 与 N22 均不启动。"),
              ("Project Control：R166。", "Project Control：R167。"),
              ("S02-B｜ACTIVE / STYLE REFERENCE PO APPROVED / CANONICAL PUBLICATION NEXT",
               "S02-B｜ACTIVE / N21 V004 DESIGN APPROVED / IMPLEMENTATION AUTHORIZATION NEXT")
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit dashboard sync
        run: |
          git config user.name "black-lady-project-control-bot"
          git config user.email "actions@github.com"
          git add docs/project_control/dashboard/dashboard.html
          git diff --cached --quiet && { echo "no dashboard change"; exit 1; }
          git commit -m "project-control: sync dashboard to R167"
          git push origin HEAD:main
