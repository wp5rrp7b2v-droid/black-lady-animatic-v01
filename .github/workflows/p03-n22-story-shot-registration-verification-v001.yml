name: N22 Story Shot Registration Verification V001

on:
  push:
    branches: [main]
    paths:
      - "production/story_shots/story_shot_index.jsonl"
      - ".github/workflows/p03-n22-story-shot-registration-verification-v001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N22 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          path = "production/image_library/approved/story_shots/N22_PEOPLE_IN_THE_FLOW_APPROVED_V001.png"
          sha = "6d1ed04106bb35943d752113e17d5f36fd2d55b29f4234e13177c7f8b6496f3a"
          blob = "a0f38041c10e4eb13a5a915a5d2f7bf22f85a2cf"
          expected_size = 1834637

          b = Path(path).read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert len(b) == expected_size
          assert hashlib.sha256(b).hexdigest() == sha
          assert subprocess.check_output(["git","hash-object",path], text=True).strip() == blob
          assert struct.unpack(">II", b[16:24]) == (941,1672)

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          hits = [x for x in rows if x.get("shot_id") == "N22"]
          assert len(hits) == 1

          r = hits[0]
          assert r["canonical_path"] == path
          assert r["filename"] == "N22_PEOPLE_IN_THE_FLOW_APPROVED_V001.png"
          assert r["sha256_locked_identity"] == sha
          assert r["github_blob_sha"] == blob
          assert r["byte_size"] == expected_size
          assert r["dimensions"] == {"width":941,"height":1672}
          assert r["approval_status"] == "APPROVED"
          assert r["lifecycle"] == "CURRENT"
          assert r["asset_class"] == "STORY_SHOT"
          assert r["title"] == "People in the Flow — Ning Observational POV"
          assert r["scene"] == "CASTLE_ENTRANCE"
          assert r["characters"] == ["SU_XIAOXIAO","LIAO_JIAN"]
          assert r["timeline"] == "01:54.700-02:04.300 / intra-parent N22 micro-cut deferred"
          assert r["rename_preserved_exact_git_blob"] is True

          assert not Path("production/image_library/approved/story_shots/e850d2a6-baf3-4d0c-ac7e-4757bf141796.png").exists()

          print("N22_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
