name: P03 Opening V2 Proof Review V003

on:
  push:
    branches: [main]
    paths:
      - 'remotion-opening-v2-review-v003/**'
      - '.github/workflows/p03-opening-v2-proof-review-v003.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p03-opening-v2-review-v003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify canonical inputs and prepare exact copies
        run: python3 remotion-opening-v2-review-v003/scripts/prepare_inputs.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install exact Remotion dependencies and typecheck
        working-directory: remotion-opening-v2-review-v003
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run typecheck

      - name: Install Remotion Chrome Headless Shell
        working-directory: remotion-opening-v2-review-v003
        run: npx remotion browser ensure

      - name: Render stronger enriched Opening V2 proof
        working-directory: remotion-opening-v2-review-v003
        run: npm run render

      - name: Technical QC
        run: python3 remotion-opening-v2-review-v003/scripts/qc_output.py

      - name: Upload review proof
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: P03_OPENING_V2_PROOF_REVIEW_V003
          path: remotion-opening-v2-review-v003/out/P03_OPENING_V2_PROOF_REVIEW_V003/
          retention-days: 7
          if-no-files-found: error

      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
