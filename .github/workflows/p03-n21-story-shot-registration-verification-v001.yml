name: N21 Story Shot Registration Verification V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n21-story-shot-registration-verification-v001.yml"
      - "production/story_shots/story_shot_index.jsonl"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N21 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          path = "production/image_library/approved/story_shots/N21_COHORT_ENTERS_INSIDE_THE_FLOW_APPROVED_V001.png"
          sha = "4296383dc3fd330240a1107c004ce22d1c0ae730b193fcba495779308ba1ab0c"
          blob = "3224760c7e5bb622679d6b4f10f4817050fa6197"
          expected_size = 2215769

          b = Path(path).read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert len(b) == expected_size
          assert hashlib.sha256(b).hexdigest() == sha
          assert subprocess.check_output(["git","hash-object",path], text=True).strip() == blob
          assert struct.unpack(">II", b[16:24]) == (941,1671)

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          hits = [x for x in rows if x.get("shot_id") == "N21"]
          assert len(hits) == 1

          r = hits[0]
          assert r["canonical_path"] == path
          assert r["filename"] == "N21_COHORT_ENTERS_INSIDE_THE_FLOW_APPROVED_V001.png"
          assert r["sha256_locked_identity"] == sha
          assert r["github_blob_sha"] == blob
          assert r["byte_size"] == expected_size
          assert r["dimensions"] == {"width":941,"height":1671}
          assert r["approval_status"] == "APPROVED"
          assert r["lifecycle"] == "CURRENT"
          assert r["asset_class"] == "STORY_SHOT"
          assert r["title"] == "Cohort Enters — Inside the Flow"
          assert r["scene"] == "CASTLE_ENTRANCE"
          assert r["characters"] == ["NEIL"]
          assert r["timeline"] == "after N20 / before N22 / exact N21 micro-cut deferred"
          assert r["rename_preserved_exact_git_blob"] is True
          assert r["dimension_exception"]["approved_exact_binary"] == "941x1671"
          assert r["dimension_exception"]["resize_forbidden"] is True

          assert not Path("staging/story_shot_candidates/N21/N21_Candidate_09_APPROVED.png").exists()

          print("N21_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_941x1671_MATCH=YES")
          print("DIMENSION_EXCEPTION_LOCK=PASS")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
