name: S02-A Assembly Input Bundle V001
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p03-s02-a-assembly-input-bundle-v001.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify canonical inputs and build bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/build_s02_a_assembly_input_bundle_v001.py
      - name: Upload verified assembly input bundle
        uses: actions/upload-artifact@v4
        with:
          name: S02_A_ASSEMBLY_INPUT_BUNDLE_V001
          path: S02_A_ASSEMBLY_INPUT_BUNDLE_V001/
          if-no-files-found: error
          retention-days: 7
