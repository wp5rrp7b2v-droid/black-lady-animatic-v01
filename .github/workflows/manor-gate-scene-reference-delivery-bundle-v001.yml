name: MANOR GATE Scene Reference Delivery Bundle V001

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manor-gate-scene-reference-delivery-bundle-v001.yml"

permissions:
  contents: read

jobs:
  build-delivery-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify canonical references and build bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, struct

          ROOT = pathlib.Path.cwd().resolve()
          SOURCE_COMMIT = os.environ["SOURCE_COMMIT"]
          BUNDLE_ID = "MANOR_GATE_SCENE_REFERENCE_V001_REFERENCE_DELIVERY_BUNDLE_V001"
          OUT = ROOT / BUNDLE_ID
          WORLD = OUT / "world_refs"
          CONT = OUT / "continuity_refs"
          REGISTRY = ROOT / "production/asset_registry/asset_registry.jsonl"
          STORY_INDEX = ROOT / "production/story_shots/story_shot_index.jsonl"

          SCENE = {
              "asset_id": "AST_IMG_000052",
              "entity_id": "SCENE_CASTLE_ENTRANCE",
              "role": "SCENE_MASTER",
              "authority_class": "MASTER",
              "resolver_usage": "CONDITIONAL",
              "approval_status": "APPROVED",
              "lifecycle": "CURRENT",
              "sha256": "d49af6a5e42d0867f2ffe4883e6af82f4d3777da3e96d788924cee2a9c743961",
              "byte_size": 2305753,
              "path": "production/image_library/scene_masters/castle_entrance/SCENE_CASTLE_ENTRANCE_SCENE_MASTER_DEFAULT_DAY_DOOR_OPEN_V001.png",
              "git_blob_sha": "e4dafe096f5c5c8782257030a5a659aeec7808f9",
              "responsibility": "WORLD_MATERIAL_PERIOD_ENVIRONMENT_AUTHORITY",
          }
          A01 = {
              "shot_id": "A01",
              "approval_status": "APPROVED",
              "lifecycle": "CURRENT",
              "byte_size": 3399726,
              "path": "production/image_library/approved/A_Series/A01_REBOOT_approved_v001.png",
              "git_blob_sha": "35769a40dc1fd559d97908235f6a6024562b71b7",
              "responsibility": "EXTERIOR_CINEMATIC_CONTINUITY",
          }

          def sha256(data): return hashlib.sha256(data).hexdigest()
          def blob(data): return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          def dims(data):
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              return struct.unpack(">II", data[16:24])
          def require_file(p):
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"Missing/redirected canonical binary: {p}")
              if p.resolve() != p:
                  raise SystemExit(f"Canonical path resolution mismatch: {p}")

          if OUT.exists() or OUT.is_symlink():
              raise SystemExit(f"Refusing to overwrite: {OUT}")
          WORLD.mkdir(parents=True)
          CONT.mkdir()

          reg=[json.loads(x) for x in REGISTRY.read_text(encoding="utf-8").splitlines() if x.strip()]
          idx=[json.loads(x) for x in STORY_INDEX.read_text(encoding="utf-8").splitlines() if x.strip()]
          refs=[]

          rows=[r for r in reg if r.get("asset_id")==SCENE["asset_id"]]
          if len(rows)!=1: raise SystemExit(f"AST_IMG_000052 registry cardinality mismatch: {len(rows)}")
          r=rows[0]
          checks={
              "entity_id":r.get("entity_id")==SCENE["entity_id"],
              "role":r.get("role")==SCENE["role"],
              "authority_class":r.get("authority_class")==SCENE["authority_class"],
              "resolver_usage":r.get("resolver_usage")==SCENE["resolver_usage"],
              "approval_status":r.get("approval_status")==SCENE["approval_status"],
              "lifecycle":r.get("lifecycle")==SCENE["lifecycle"],
              "sha256":r.get("sha256")==SCENE["sha256"],
              "byte_size":r.get("byte_size")==SCENE["byte_size"],
              "storage_uri":r.get("storage_uri")==SCENE["path"],
          }
          if not all(checks.values()): raise SystemExit(f"AST_IMG_000052 registry validation failed: {checks}")
          src=ROOT/SCENE["path"]; require_file(src); data=src.read_bytes()
          w,h=dims(data)
          if sha256(data)!=SCENE["sha256"] or len(data)!=SCENE["byte_size"] or blob(data)!=SCENE["git_blob_sha"]:
              raise SystemExit("AST_IMG_000052 binary identity mismatch")
          dst=WORLD/f'{SCENE["asset_id"]}__{src.name}'; shutil.copyfile(src,dst)
          refs.append({"asset_id":SCENE["asset_id"],"shot_id":None,"responsibility":SCENE["responsibility"],
              "authority_class":"MASTER_WORLD_ONLY_NOT_GATE_GEOMETRY","canonical_path":SCENE["path"],
              "bundle_path":dst.relative_to(OUT).as_posix(),"sha256":sha256(data),"byte_size":len(data),
              "git_blob_sha":blob(data),"width":w,"height":h,"source_commit":SOURCE_COMMIT})

          rows=[r for r in idx if r.get("shot_id")=="A01"]
          if len(rows)!=1: raise SystemExit(f"A01 Story Shot index cardinality mismatch: {len(rows)}")
          r=rows[0]
          checks={"approval_status":r.get("approval_status")==A01["approval_status"],
                  "lifecycle":r.get("lifecycle")==A01["lifecycle"],
                  "canonical_path":r.get("canonical_path")==A01["path"],
                  "byte_size":r.get("byte_size")==A01["byte_size"],
                  "github_blob_sha":r.get("github_blob_sha")==A01["git_blob_sha"]}
          if not all(checks.values()): raise SystemExit(f"A01 index validation failed: {checks}")
          src=ROOT/A01["path"]; require_file(src); data=src.read_bytes(); w,h=dims(data)
          if len(data)!=A01["byte_size"] or blob(data)!=A01["git_blob_sha"]:
              raise SystemExit("A01 binary identity mismatch")
          dst=CONT/f'A01__{src.name}'; shutil.copyfile(src,dst)
          refs.append({"asset_id":None,"shot_id":"A01","responsibility":A01["responsibility"],
              "authority_class":"CONTINUITY","canonical_path":A01["path"],
              "bundle_path":dst.relative_to(OUT).as_posix(),"sha256":sha256(data),
              "sha256_identity_mode":"COMPUTED_FROM_LOCKED_PATH_SIZE_GIT_BLOB",
              "byte_size":len(data),"git_blob_sha":blob(data),"width":w,"height":h,"source_commit":SOURCE_COMMIT})

          manifest={
              "bundle_id":BUNDLE_ID,
              "target":"MANOR_GATE_SCENE_REFERENCE_V001_CANDIDATE_01",
              "bundle_type":"SCENE_REFERENCE_CREATION",
              "source_commit":SOURCE_COMMIT,
              "reference_count":2,
              "reference_policy":"MINIMUM_CANONICAL_REFERENCES",
              "manual_product_owner_reference_upload":0,
              "authority_precedence":[
                  "DIRECTOR_SCENE_IDENTITY_LOCK",
                  "AST_IMG_000052_WORLD_MATERIAL_PERIOD_ENVIRONMENT_AUTHORITY",
                  "A01_EXTERIOR_CINEMATIC_CONTINUITY",
                  "RECONSTRUCTED_GATE_GEOMETRY_DEFINITION"
              ],
              "director_lock":{
                  "scene_identity":"DETACHED_ESTATE_PERIMETER_GATE_NOT_CASTLE_BUILDING_ENTRANCE",
                  "gate_geometry_provenance":"RECONSTRUCTED_VISUAL_DESIGN",
                  "composition":"9:16 INTERIOR_SIDE_3Q_ESTABLISHING 30_TO_45_DEGREES",
                  "required_spatial_read":["GATE","LEFT_RIGHT_BOUNDARY","INTERNAL_ROAD","EXTERNAL_ROAD"],
                  "base_state":"DEFAULT_DAY_CLOSED_V001",
                  "day":True,"dry":True,"gate_closed":True,
                  "forbid_rain":True,"forbid_people":True,"forbid_vehicles":True,
                  "forbid_key":True,"forbid_action":True,"forbid_locked_emphasis":True,
                  "do_not_copy_castle_entrance_door_as_manor_gate":True
              },
              "excluded_references":["SCENE_FIRST_HALL","A02_TO_A07","N01_TO_N14","ALL_CHARACTER_CORE_REFERENCES",
                  "NEIL","KEYS_KEY_RINGS_LOCK_EMPHASIS","CHURCH","BLACK_LADY","RAIN_STATE_IMAGERY",
                  "GENERIC_EXTERNAL_MANOR_GATE_REFERENCES","INTERNET_REFERENCE_IMAGES","REJECTED_OR_SUPERSEDED_CANDIDATES"],
              "references":refs,
              "overall_result":"PASS"
          }
          (OUT/"delivery_manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (OUT/"WORK_HANDOFF.md").write_text("""# MANOR_GATE_SCENE_REFERENCE_V001 — Work Handoff

Generate exactly one MANOR_GATE_SCENE_REFERENCE_V001 Candidate 01.

This is a reusable Scene Reference, not N15 final Story Shot.

Identity lock:
- detached estate perimeter gate, NOT castle building entrance;
- 9:16 vertical, neutral 3/4 establishing view from estate interior, about 30–45 degrees;
- show Gate + lateral boundary + internal road + external road;
- two-leaf wrought-iron gate, old masonry piers, continuing perimeter wall/iron fencing;
- mature vegetation, old European estate visual language, maintained but aged, not ruins.

Base state: DEFAULT_DAY_CLOSED_V001.
DAY / DRY / CLOSED / NO RAIN / NO PEOPLE / NO VEHICLES / NO KEY / NO ACTION.
Do not emphasize LOCKED; no padlock or chain narrative cue.

Authority:
- AST_IMG_000052 controls world/material/period/environment continuity ONLY.
- A01 controls exterior cinematic continuity.
- Gate geometry is RECONSTRUCTED_VISUAL_DESIGN.
- DO NOT COPY CASTLE ENTRANCE DOOR AS MANOR GATE.
- Do not embed the manor gate in the castle facade or reproduce the castle entrance steps/threshold as the gate.

Use only the two delivered PNG references. No internet images and no manual Product Owner reference upload.

Before generation, revalidate both delivered PNGs against delivery_manifest.json. Fail closed on any SHA/byte/blob mismatch.
""",encoding="utf-8")

          for ref in refs:
              data=(OUT/ref["bundle_path"]).read_bytes()
              if sha256(data)!=ref["sha256"] or len(data)!=ref["byte_size"] or blob(data)!=ref["git_blob_sha"]:
                  raise SystemExit(f"Final revalidation failed: {ref['canonical_path']}")
          print("PASS: 2/2 exact canonical reference binaries verified")
          for ref in refs:
              print(f"{ref.get('asset_id') or ref.get('shot_id')} SHA256={ref['sha256']} BYTES={ref['byte_size']} BLOB={ref['git_blob_sha']}")
          print(f"BUNDLE_ID={BUNDLE_ID}")
          print(f"SOURCE_COMMIT={SOURCE_COMMIT}")
          PY

      - name: Upload Scene Reference delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANOR_GATE_SCENE_REFERENCE_V001_REFERENCE_DELIVERY_BUNDLE_V001
          path: MANOR_GATE_SCENE_REFERENCE_V001_REFERENCE_DELIVERY_BUNDLE_V001/
          retention-days: 7
          if-no-files-found: error
