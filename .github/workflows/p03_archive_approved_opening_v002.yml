name: P03 Archive PO-Approved Opening V2 V002

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03_archive_approved_opening_v002.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: p03-archive-approved-opening-v002
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: 70d7922244161dd216a26446fd75531db20eea0ac7fc25f567f6ff14e2746e3a
      EXPECTED_BYTES: "18892138"
      SOURCE_RUN_ID: "36296689531"
      SOURCE_ARTIFACT_ID: "10924430609"
      SOURCE_ARTIFACT_NAME: P03_OPENING_V2_PROOF_REVIEW_V002
      SOURCE_ARTIFACT_DIGEST: sha256:323a48034e45562b5153d635dbe565f51211d81a694c44202b6da92e4deba2ac
      CANONICAL_PATH: production/video/approved/opening/P03_OPENING_V2_APPROVED_V001.mp4
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact historical V002 artifact
        run: |
          rm -rf /tmp/v002
          mkdir -p /tmp/v002
          gh run download "$SOURCE_RUN_ID"             --repo "${{ github.repository }}"             --name "$SOURCE_ARTIFACT_NAME"             --dir /tmp/v002
          find /tmp/v002 -maxdepth 3 -type f -print

      - name: Locate and verify exact approved MP4
        id: verify
        run: |
          set -euo pipefail
          SRC="$(find /tmp/v002 -type f -name 'P03_OPENING_V2_PROOF_REVIEW_V002.mp4' -print -quit)"
          test -n "$SRC"
          ACTUAL_SHA="$(sha256sum "$SRC" | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -c %s "$SRC")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA256"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"

          ffprobe -v error -show_streams -show_format -of json "$SRC" > /tmp/v002_ffprobe.json
          python3 - "$SRC" <<'PY'
          import json, subprocess, sys
          from fractions import Fraction
          p=sys.argv[1]
          d=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_streams","-show_format","-of","json",p
          ], text=True))
          v=[x for x in d["streams"] if x["codec_type"]=="video"]
          a=[x for x in d["streams"] if x["codec_type"]=="audio"]
          assert len(v)==1 and len(a)==1
          v=v[0]; a=a[0]
          assert v["codec_name"]=="h264"
          assert v["pix_fmt"]=="yuv420p"
          assert int(v["width"])==1080 and int(v["height"])==1920
          assert Fraction(v["avg_frame_rate"])==30
          assert int(v["nb_frames"])==991
          assert a["codec_name"]=="aac"
          assert int(a["sample_rate"])==48000
          assert int(a["channels"])==2
          assert abs(float(d["format"]["duration"])-33.088)<0.01
          print("MEDIA_IDENTITY=PASS")
          PY

          ffmpeg -v error -xerror -i "$SRC" -map 0:v:0 -map 0:a:0 -f null -
          echo "FULL_DECODE=PASS"

          mkdir -p "$(dirname "$CANONICAL_PATH")"
          cp --preserve=timestamps "$SRC" "$CANONICAL_PATH"

          COPY_SHA="$(sha256sum "$CANONICAL_PATH" | awk '{print $1}')"
          COPY_BYTES="$(stat -c %s "$CANONICAL_PATH")"
          test "$COPY_SHA" = "$EXPECTED_SHA256"
          test "$COPY_BYTES" = "$EXPECTED_BYTES"

          echo "source=$SRC" >> "$GITHUB_OUTPUT"
          echo "sha256=$COPY_SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$COPY_BYTES" >> "$GITHUB_OUTPUT"

      - name: Register approved Opening master index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          idx=Path("production/video/video_index.jsonl")
          idx.parent.mkdir(parents=True, exist_ok=True)
          records=[]
          if idx.exists():
              records=[json.loads(x) for x in idx.read_text().splitlines() if x.strip()]

          record={
            "video_id":"OPENING_V001",
            "role":"OPENING",
            "title":"Opening V2 Approved Master V001",
            "canonical_path":"production/video/approved/opening/P03_OPENING_V2_APPROVED_V001.mp4",
            "source_proof":"P03_OPENING_V2_PROOF_REVIEW_V002",
            "source_run_id":36296689531,
            "source_artifact_id":10924430609,
            "source_artifact_digest":"sha256:323a48034e45562b5153d635dbe565f51211d81a694c44202b6da92e4deba2ac",
            "sha256":"70d7922244161dd216a26446fd75531db20eea0ac7fc25f567f6ff14e2746e3a",
            "byte_size":18892138,
            "width":1080,
            "height":1920,
            "fps":30,
            "frame_count":991,
            "container_duration_sec":33.088,
            "video_codec":"h264",
            "pixel_format":"yuv420p",
            "audio_codec":"aac",
            "audio_sample_rate":48000,
            "audio_channels":2,
            "approval_status":"APPROVED",
            "approved_by":"PRODUCT_OWNER",
            "approved_on":"2026-09-27",
            "lifecycle":"CURRENT",
            "note":"PO-approved opening video. V002 source binary archived exactly; reusable editing workflow is governed separately by RC-026 and is not a fixed visual template."
          }

          records=[r for r in records if r.get("video_id")!="OPENING_V001"]
          records.append(record)
          idx.write_text("\n".join(json.dumps(r,ensure_ascii=False,separators=(",",":")) for r in records)+"\n")
          PY

      - name: Commit canonical approved Opening binary
        id: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$CANONICAL_PATH" production/video/video_index.jsonl
          GIT_BLOB="$(git hash-object "$CANONICAL_PATH")"
          echo "GIT_BLOB=$GIT_BLOB"

          git commit -m "Archive PO-approved Opening V2 master V001"
          COMMIT_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "git_blob=$GIT_BLOB" >> "$GITHUB_OUTPUT"

      - name: Post-push remote verification
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.publish.outputs.commit_sha }}"
          test "$(git rev-parse origin/main:$CANONICAL_PATH)" = "${{ steps.publish.outputs.git_blob }}"
          REMOTE_BYTES="$(git cat-file -s origin/main:$CANONICAL_PATH)"
          test "$REMOTE_BYTES" = "$EXPECTED_BYTES"
          echo "REMOTE_BINARY_VERIFICATION=PASS"

      - name: Write approval/archive receipt
        run: |
          mkdir -p /tmp/opening_archive_receipt
          cat > /tmp/opening_archive_receipt/OPENING_V001_APPROVAL_ARCHIVE_RECEIPT.json <<EOF
          {
            "status": "PASS",
            "approval": "PRODUCT_OWNER_APPROVED",
            "approved_on": "2026-09-27",
            "canonical_path": "$CANONICAL_PATH",
            "source_proof": "$SOURCE_ARTIFACT_NAME",
            "source_run_id": $SOURCE_RUN_ID,
            "source_artifact_id": $SOURCE_ARTIFACT_ID,
            "source_artifact_digest": "$SOURCE_ARTIFACT_DIGEST",
            "sha256": "${{ steps.verify.outputs.sha256 }}",
            "byte_size": ${{ steps.verify.outputs.bytes }},
            "git_blob": "${{ steps.publish.outputs.git_blob }}",
            "publication_commit": "${{ steps.publish.outputs.commit_sha }}",
            "media_identity": "PASS",
            "full_decode": "PASS",
            "remote_binary_verification": "PASS"
          }
          EOF
          cat /tmp/opening_archive_receipt/OPENING_V001_APPROVAL_ARCHIVE_RECEIPT.json

      - name: Upload approval/archive receipt
        uses: actions/upload-artifact@v4
        with:
          name: P03_OPENING_V001_APPROVAL_ARCHIVE_RECEIPT
          path: /tmp/opening_archive_receipt/
          retention-days: 30
          if-no-files-found: error
