name: N26 Story Shot Registration Verification V001

on:
  push:
    branches: [main]
    paths:
      - "production/story_shots/story_shot_index.jsonl"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N26 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          path = "production/image_library/approved/story_shots/N26_LADYS_RULE_AND_FORWARD_MOTION_APPROVED_V001.png"
          sha = "8dcd5f5449ad6429f45e7b4f59ce15bfd574eeb8aa45a83d4e4132df3cf436d9"
          blob = "a5ce429689a99437773385e25b9813745e380f74"
          expected_size = 2504586

          b = Path(path).read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert len(b) == expected_size
          assert hashlib.sha256(b).hexdigest() == sha
          assert subprocess.check_output(["git","hash-object",path], text=True).strip() == blob
          assert struct.unpack(">II", b[16:24]) == (941,1672)

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          hits = [x for x in rows if x.get("shot_id") == "N26"]
          assert len(hits) == 1

          r = hits[0]
          assert r["canonical_path"] == path
          assert r["filename"] == "N26_LADYS_RULE_AND_FORWARD_MOTION_APPROVED_V001.png"
          assert r["sha256_locked_identity"] == sha
          assert r["github_blob_sha"] == blob
          assert r["byte_size"] == expected_size
          assert r["dimensions"] == {"width":941,"height":1672}
          assert r["approval_status"] == "APPROVED"
          assert r["lifecycle"] == "CURRENT"
          assert r["asset_class"] == "STORY_SHOT"
          assert r["title"] == "Lady's Rule and Forward Motion"
          assert r["scene"] == "CASTLE_ENTRANCE_INNER_LOBBY"
          assert r["characters"] == ["NEIL","NING_QIUSHUI","JUN_LUYUAN"]
          assert r["timeline"] == "after N25 / source dialogue approx 02:19.000-02:23.000 / exact N26 micro-cut deferred"
          assert r["rename_preserved_exact_git_blob"] is True

          assert not Path("staging/story_shot_candidates/N26/N26_Candidate_03_APPROVED.png").exists()

          print("N26_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
