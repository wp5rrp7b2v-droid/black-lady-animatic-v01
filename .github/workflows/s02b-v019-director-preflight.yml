name: S02-B V019 Director Visual Diagnostic V001
on:
  push:
    branches:
      - feature/s02b-v019-directors-cut-20261018
    paths:
      - ".github/workflows/s02b-v019-director-preflight.yml"
      - "scripts/s02b_v019_director_contact_preflight.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout director work branch
        uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user Pillow
      - name: Create exact V018 chronological contact sheet
        run: python3 scripts/s02b_v019_director_contact_preflight.py
      - name: Save evidence on isolated branch
        uses: actions/upload-artifact@v4
        with:
          name: S02B_V019_DIRECTOR_VISUAL_PREFLIGHT_V001
          path: production/video_candidates/review/s02b_v019_directors_cut_preflight/
          retention-days: 14
          if-no-files-found: error
      - name: Keep directorial evidence under branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/video_candidates/review/s02b_v019_directors_cut_preflight/
          if ! git diff --cached --quiet; then
            git commit -m "Archive V019 V018 source montage, review only"
            git push origin HEAD:feature/s02b-v019-directors-cut-20261018
          fi
