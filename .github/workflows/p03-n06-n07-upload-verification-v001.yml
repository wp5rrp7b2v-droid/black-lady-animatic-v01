name: P03 N06-N07 Upload Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n06-n07-upload-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify-uploads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify uploaded PNGs and stage exact binaries
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, struct

          root = pathlib.Path.cwd().resolve()
          srcdir = root / "production/image_library/approved/story_shots"
          out = root / "N06_N07_UPLOAD_VERIFICATION_V001"
          out.mkdir()

          names = [
              "33e88fb0-a959-4ab1-937c-bdd1269d7bc1.png",
              "6ef6a4b1-e823-40f4-be98-e7d658fdaddc.png",
          ]

          rows = []
          for name in names:
              p = srcdir / name
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"Missing or redirected upload: {name}")
              data = p.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid PNG: {name}")
              w, h = struct.unpack(">II", data[16:24])
              sha256 = hashlib.sha256(data).hexdigest()
              git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if (w,h) != (941,1672):
                  raise SystemExit(f"Unexpected dimensions for {name}: {w}x{h}")
              if git_blob != os.popen(f"git hash-object '{p}'").read().strip():
                  raise SystemExit(f"Git blob mismatch: {name}")
              shutil.copyfile(p, out / name)
              rows.append({
                  "filename": name,
                  "byte_size": len(data),
                  "sha256": sha256,
                  "git_blob_sha": git_blob,
                  "width": w,
                  "height": h,
                  "source_commit": os.environ["SOURCE_COMMIT"],
              })

          (out / "upload_manifest.json").write_text(
              json.dumps({"source_commit":os.environ["SOURCE_COMMIT"],"count":2,"files":rows,"overall_result":"PASS"},indent=2)+"\n",
              encoding="utf-8"
          )
          print(json.dumps(rows, indent=2))
          print("PASS: 2/2 uploaded PNG binaries staged exactly")
          PY

      - name: Upload verification artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: N06_N07_UPLOAD_VERIFICATION_V001
          path: N06_N07_UPLOAD_VERIFICATION_V001/
          retention-days: 7
          if-no-files-found: error
