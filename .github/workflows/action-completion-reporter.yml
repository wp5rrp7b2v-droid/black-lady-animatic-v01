name: Action Completion Reporter

on:
  workflow_run:
    workflows:
      - "S02-A Assembly Input Bundle V001"
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Report workflow completion
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            const artifactsResponse =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });

            const artifacts = artifactsResponse.data.artifacts;

            const artifactNames =
              artifacts.length > 0
                ? artifacts.map(a => `- ${a.name}`).join('\n')
                : '- none';

            const icon =
              run.conclusion === 'success' ? '✅' : '❌';

            const body = [
              `${icon} **ACTION COMPLETE**`,
              ``,
              `**Workflow:** ${run.name}`,
              ``,
              `**Run ID:** ${run.id}`,
              ``,
              `**Conclusion:** ${run.conclusion}`,
              ``,
              `**Source SHA:** ${run.head_sha}`,
              ``,
              `**Artifacts:**`,
              artifactNames,
              ``,
              `**Run:** ${run.html_url}`,
              ``,
              `**Completed:** ${run.updated_at}`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 17,
              body: body
            });
