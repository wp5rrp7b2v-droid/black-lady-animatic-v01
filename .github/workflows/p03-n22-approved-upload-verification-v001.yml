name: N22 Approved Story Shot Exact Binary Verification

on:
  push:
    branches: [main]
    paths:
      - "production/image_library/approved/story_shots/N22_Candidate_04_APPROVED_SOURCE.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N22 approved binary
        shell: python
        run: |
          from pathlib import Path
          import hashlib, struct, subprocess

          p = Path("production/image_library/approved/story_shots/N22_Candidate_04_APPROVED_SOURCE.png")
          assert p.is_file(), "APPROVED_SOURCE_NOT_FOUND"

          b = p.read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n", "PNG_SIGNATURE_FAIL"

          w, h = struct.unpack(">II", b[16:24])

          expected_size = 1834637
          expected_sha = "6d1ed04106bb35943d752113e17d5f36fd2d55b29f4234e13177c7f8b6496f3a"
          expected_blob = "a0f38041c10e4eb13a5a915a5d2f7bf22f85a2cf"

          actual_size = len(b)
          actual_sha = hashlib.sha256(b).hexdigest()
          actual_blob = subprocess.check_output(
              ["git", "hash-object", str(p)], text=True
          ).strip()

          assert (w, h) == (941, 1672), "DIMENSIONS_FAIL"
          assert actual_size == expected_size, "BYTE_SIZE_FAIL"
          assert actual_sha == expected_sha, "SHA256_FAIL"
          assert actual_blob == expected_blob, "GIT_BLOB_FAIL"

          print(f"FILENAME={p.name}")
          print(f"BYTE_SIZE={actual_size}")
          print(f"SHA256={actual_sha}")
          print(f"GIT_BLOB={actual_blob}")
          print(f"DIMENSIONS={w}x{h}")
          print("PNG_SIGNATURE=PASS")
          print("SHA_MATCH=YES")
          print("BLOB_MATCH=YES")
          print("OVERALL_RESULT=PASS")
