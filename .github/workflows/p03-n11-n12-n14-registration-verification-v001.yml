name: P03 N11 N12 N14 Registration Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n11-n12-n14-registration-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify-story-shot-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify canonical binaries and Story Shot Index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct

          ROOT=pathlib.Path.cwd()
          index_path=ROOT/"production/story_shots/story_shot_index.jsonl"
          rows=[json.loads(x) for x in index_path.read_text().splitlines() if x.strip()]
          items=[
            {
              "shot_id":"N11",
              "path":"production/image_library/approved/story_shots/N11_NEIL_ABNORMAL_PORTRAIT_APPROVED_V001.png",
              "filename":"N11_NEIL_ABNORMAL_PORTRAIT_APPROVED_V001.png",
              "sha256":"09d45c1b27fbd2aea68c818677d9656a2ae7f39296f80f6db622118312aebcc5",
              "bytes":2538801,"blob":"f5efde465dcadd1490f2064c6db39e1d5f194dc6"
            },
            {
              "shot_id":"N12",
              "path":"production/image_library/approved/story_shots/N12_NEIL_CROSS_RIGID_SMILE_APPROVED_V001.png",
              "filename":"N12_NEIL_CROSS_RIGID_SMILE_APPROVED_V001.png",
              "sha256":"d94dc3623ba1abc55aa86c8b646d7876d097433bfadb70291bfa9c68cffc030b",
              "bytes":2434337,"blob":"853d04f5ed8a2e1845ce1dfa9cef5c02f123124b"
            },
            {
              "shot_id":"N14",
              "path":"production/image_library/approved/story_shots/N14_FIRST_ENCOUNTER_IMPORTANCE_APPROVED_V001.png",
              "filename":"N14_FIRST_ENCOUNTER_IMPORTANCE_APPROVED_V001.png",
              "sha256":"0474003a1d6d48a652935033f17560d0ee1d689caadbdb7d4af72560477844f1",
              "bytes":2500282,"blob":"e32c03bc21efcd0eda98d2e9868a64915583b19f"
            }
          ]
          def git_blob(b):
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          report={"source_commit":"${{ github.sha }}","shots":[],"overall_result":"PASS"}
          for x in items:
              matches=[r for r in rows if r.get("shot_id")==x["shot_id"]]
              if len(matches)!=1:
                  raise SystemExit(f"{x['shot_id']}_FAIL index cardinality={len(matches)}")
              row=matches[0]
              p=ROOT/x["path"]
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"{x['shot_id']}_FAIL canonical binary missing/not regular")
              b=p.read_bytes()
              if b[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{x['shot_id']}_FAIL PNG signature")
              w,h=struct.unpack(">II",b[16:24])
              actual_sha=hashlib.sha256(b).hexdigest()
              actual_blob=git_blob(b)
              checks={
                "approval":row.get("approval_status")=="APPROVED",
                "lifecycle":row.get("lifecycle")=="CURRENT",
                "asset_class":row.get("asset_class")=="STORY_SHOT",
                "canonical_path":row.get("canonical_path")==x["path"],
                "filename":row.get("filename")==x["filename"],
                "byte_size":row.get("byte_size")==x["bytes"]==len(b),
                "dimensions":row.get("dimensions")=={"width":941,"height":1672} and (w,h)==(941,1672),
                "blob":row.get("github_blob_sha")==x["blob"]==actual_blob,
                "sha256":row.get("sha256_locked_identity")==x["sha256"]==actual_sha,
                "exact_blob":row.get("rename_preserved_exact_git_blob") is True
              }
              if not all(checks.values()):
                  raise SystemExit(f"{x['shot_id']}_FAIL {checks}")
              report["shots"].append({"shot_id":x["shot_id"],"sha256":actual_sha,"bytes":len(b),"blob":actual_blob,"width":w,"height":h,"index_match":True})
              print(f"{x['shot_id']}_PASS SHA256={actual_sha} BYTES={len(b)} BLOB={actual_blob} INDEX_MATCH=YES")
          staged=[
            "N11_FINAL_SOURCE_UPLOAD.png","N12_FINAL_SOURCE_UPLOAD.png","N14_FINAL_SOURCE_UPLOAD.png",
            "59efdf38-9bf4-44b9-a734-c6f68a03b6e8.png","72238825-69b7-413f-82a9-1eeff06d1744.png","a995a8ee-d606-4755-873b-58f768564531.png"
          ]
          base=ROOT/"production/image_library/approved/story_shots"
          leftovers=[x for x in staged if (base/x).exists()]
          if leftovers:
              raise SystemExit(f"STAGING_CLEANUP_FAIL leftovers={leftovers}")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
          pathlib.Path("registration_verification_report.json").write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Upload registration verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: N11_N12_N14_REGISTRATION_VERIFICATION_V001
          path: registration_verification_report.json
          retention-days: 7
