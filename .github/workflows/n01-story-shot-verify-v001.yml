name: N01 Story Shot Verify V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/n01-story-shot-verify-v001.yml"
      - "production/image_library/approved/story_shots/N01_JUN_POSE_LOCAL_CANDIDATE_01.png"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Produce verification report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > N01_VERIFY_REPORT.txt
          import hashlib, pathlib, struct
          p = pathlib.Path("production/image_library/approved/story_shots/N01_JUN_POSE_LOCAL_CANDIDATE_01.png")
          if not p.is_file():
              print("FILE_EXISTS=NO")
              raise SystemExit(0)
          b = p.read_bytes()
          sha = hashlib.sha256(b).hexdigest()
          is_png = b[:8] == bytes([137,80,78,71,13,10,26,10])
          w = h = None
          if is_png and len(b) >= 24:
              w, h = struct.unpack(">II", b[16:24])
          print("FILE_EXISTS=YES")
          print(f"N01_PATH={p.as_posix()}")
          print(f"N01_BYTES={len(b)}")
          print(f"N01_SHA256={sha}")
          print(f"N01_DIMENSIONS={w}x{h}")
          print(f"PNG_SIGNATURE={'YES' if is_png else 'NO'}")
          print(f"BYTE_MATCH={'YES' if len(b)==2687303 else 'NO'}")
          print(f"SHA_MATCH={'YES' if sha=='a96d52410c1645711545c80b7fe4e3eaa3e8f00b088ebaaea210bbdbec84557b' else 'NO'}")
          print(f"DIMENSION_MATCH={'YES' if (w,h)==(941,1672) else 'NO'}")
          PY

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: N01_VERIFY_REPORT
          path: N01_VERIFY_REPORT.txt
          retention-days: 7
          if-no-files-found: error

      - name: Enforce verification
        shell: bash
        run: |
          set -euo pipefail
          cat N01_VERIFY_REPORT.txt
          grep -q '^FILE_EXISTS=YES$' N01_VERIFY_REPORT.txt
          grep -q '^PNG_SIGNATURE=YES$' N01_VERIFY_REPORT.txt
          grep -q '^BYTE_MATCH=YES$' N01_VERIFY_REPORT.txt
          grep -q '^SHA_MATCH=YES$' N01_VERIFY_REPORT.txt
          grep -q '^DIMENSION_MATCH=YES$' N01_VERIFY_REPORT.txt
