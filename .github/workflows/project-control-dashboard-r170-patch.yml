name: Project Control Dashboard R170 Patch

on:
  push:
    branches: [main]
    paths:
      - "production/control_requests/dashboard_r170_patch.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dashboard to R170
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/project_control/dashboard/dashboard.html")
          s=p.read_text(encoding="utf-8")
          replacements=[
            ("Project Dashboard V104","Project Dashboard V105"),
            ("Derived from R169 · Updated 2026-10-01","Derived from R170 · Updated 2026-10-01"),
            ("P0.3｜S02-B ACTIVE｜V004 Formal Build 2/2 PASS","P0.3｜S02-B ACTIVE｜N21 Candidate 05 已授权生成"),
            ("N21_REFERENCE_DELIVERY_BUNDLE_V004 已正式构建并完成独立 exact verification：2/2 PASS，GENERATION_ALLOWED=TRUE。下一步等待 Candidate 05 单独生成授权；N22 不启动。",
             "N21 Candidate 05 已获 Product Owner 正式生成授权：只允许 Clean Regeneration 生成 1 张 PNG，使用正式 Artifact 11145497260；完成后立即停下等待审核。"),
            ("Candidate 05 Authorization NEXT","Candidate 05 Work Generation / PO Review"),
            ("N21 Candidate 04：NOT APPROVED；Candidate 05：NOT AUTHORIZED；N22：NOT STARTED。",
             "N21 Candidate 04：NOT APPROVED；Candidate 05：AUTHORIZED FOR ONE WORK GENERATION；N22：NOT STARTED。"),
            ("Candidate 01–04 均未通过｜Candidate 05 未授权",
             "Candidate 01–04 均未通过｜Candidate 05 已授权生成 1 张"),
            ("恢复点：Product Owner 授权 N21 Candidate 05 Work Generation；当前正式 Artifact 11145497260。",
             "恢复点：等待 N21 Candidate 05 Work 输出并进行 Product Owner 审核；正式 Artifact 11145497260。"),
            ("Next：等待 N21 Candidate 05 Work Generation 授权；N22 不启动。",
             "Next：Work 生成唯一一张 Candidate 05 后立即停止，进入 Product Owner Review；N22 不启动。"),
            ("Project Control：R169。","Project Control：R170。"),
            ("S02-B｜ACTIVE / V004 FORMAL 2 OF 2 PASS / CANDIDATE 05 AUTHORIZATION NEXT",
             "S02-B｜ACTIVE / CANDIDATE 05 AUTHORIZED / PRODUCT OWNER REVIEW NEXT")
          ]
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit dashboard sync
        run: |
          git config user.name "black-lady-project-control-bot"
          git config user.email "actions@github.com"
          git add docs/project_control/dashboard/dashboard.html
          git diff --cached --quiet && { echo "no dashboard change"; exit 1; }
          git commit -m "project-control: sync dashboard to R170"
          git push origin HEAD:main
