name: One-Time Approved Video Drive Export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-approved-video-drive-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify approved video binaries
        shell: bash
        run: |
          set -euo pipefail
          A="production/video/approved/opening/P03_OPENING_V2_APPROVED_V001.mp4"
          B="production/video/approved/s02_a/S02_A_ASSEMBLY_APPROVED_V001.mp4"

          test "$(stat -c%s "$A")" -eq 18892138
          test "$(sha256sum "$A" | awk '{print $1}')" = "70d7922244161dd216a26446fd75531db20eea0ac7fc25f567f6ff14e2746e3a"

          test "$(stat -c%s "$B")" -eq 6822004
          test "$(sha256sum "$B" | awk '{print $1}')" = "937008e11d20892ea0a17be64719a19cb131d174871930bc29004a678bb58ed1"

      - name: Prepare exact export
        shell: bash
        run: |
          set -euo pipefail
          OUT="APPROVED_VIDEO_DRIVE_MIGRATION_V001"
          mkdir -p "$OUT"
          cp "production/video/approved/opening/P03_OPENING_V2_APPROVED_V001.mp4" "$OUT/"
          cp "production/video/approved/s02_a/S02_A_ASSEMBLY_APPROVED_V001.mp4" "$OUT/"
          (
            cd "$OUT"
            sha256sum *.mp4 > SHA256SUMS.txt
            stat -c '%n %s' *.mp4 > BYTE_SIZES.txt
          )
          printf 'source_commit=%s\n' "$GITHUB_SHA" > "$OUT/EXPORT_RECEIPT.txt"

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: APPROVED_VIDEO_DRIVE_MIGRATION_V001
          path: APPROVED_VIDEO_DRIVE_MIGRATION_V001/
          retention-days: 7
          if-no-files-found: error
