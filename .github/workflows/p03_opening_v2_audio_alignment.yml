name: P0.3 Opening V2 Audio Alignment Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p03_opening_v2_audio_alignment.yml"
      - ".github/p03_opening_v2_audio_alignment_trigger.txt"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIO_PATH: staging/p0_3_a01_a02_transition_validation/AUDIO_MVP1_CANONICAL_V001.m4a
      EXPECTED_SHA256: 8d0d12d3af5e2c15032912605c0d1b3f3e892fe24918a7064864b136987737a0
      OPENING_END_SEC: "33.020"

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Verify tools and canonical audio identity
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          test -f "$AUDIO_PATH"

          ACTUAL_SHA256="$(sha256sum "$AUDIO_PATH" | awk '{print $1}')"
          BYTE_SIZE="$(stat -c '%s' "$AUDIO_PATH")"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO_PATH")"

          echo "actual_sha256=$ACTUAL_SHA256"
          echo "byte_size=$BYTE_SIZE"
          echo "duration=$DURATION"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "SHA256_MISMATCH"
            exit 1
          fi

          mkdir -p out
          python3 - <<'PY'
          import json, os
          payload = {
              "audio_path": os.environ["AUDIO_PATH"],
              "expected_sha256": os.environ["EXPECTED_SHA256"],
              "actual_sha256": os.popen(f"sha256sum '{os.environ['AUDIO_PATH']}'").read().split()[0],
              "byte_size": os.path.getsize(os.environ["AUDIO_PATH"]),
          }
          with open("out/source_identity.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)
          PY

      - name: Extract exact Opening V2 analysis window
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i "$AUDIO_PATH"             -t "$OPENING_END_SEC"             -ac 1 -ar 44100 -c:a pcm_s16le             out/opening_v2_00_00_33_020.wav

          ffmpeg -hide_banner -loglevel error -y             -i out/opening_v2_00_00_33_020.wav             -filter_complex "showwavespic=s=1600x480:split_channels=0"             -frames:v 1 out/opening_v2_waveform.png

      - name: Multi-threshold pause detection
        shell: bash
        run: |
          set -euo pipefail
          for DB in 30 34 38 42; do
            ffmpeg -hide_banner -nostats               -i out/opening_v2_00_00_33_020.wav               -af "silencedetect=noise=-${DB}dB:d=0.060"               -f null - 2> "out/silence_minus_${DB}db.log" || true
          done

      - name: Compute energy valleys and candidate shot cut points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json, math, statistics, wave
          from array import array

          wav_path = "out/opening_v2_00_00_33_020.wav"
          with wave.open(wav_path, "rb") as w:
              rate = w.getframerate()
              channels = w.getnchannels()
              width = w.getsampwidth()
              frames = w.readframes(w.getnframes())

          if channels != 1 or width != 2:
              raise SystemExit(f"unexpected WAV format channels={channels} width={width}")

          samples = array("h")
          samples.frombytes(frames)
          if samples.itemsize != 2:
              raise SystemExit("unexpected sample width")

          step_ms = 10
          frame_n = max(1, int(rate * step_ms / 1000))
          rms = []
          for i in range(0, len(samples), frame_n):
              chunk = samples[i:i+frame_n]
              if not chunk:
                  break
              v = math.sqrt(sum(x*x for x in chunk) / len(chunk))
              rms.append(v)

          # 120 ms centered smoothing for robust low-energy valley search.
          radius = 6
          smooth = []
          for i in range(len(rms)):
              lo, hi = max(0, i-radius), min(len(rms), i+radius+1)
              smooth.append(sum(rms[lo:hi])/(hi-lo))

          def q(values, p):
              xs = sorted(values)
              if not xs:
                  return 0.0
              pos = p*(len(xs)-1)
              lo, hi = int(math.floor(pos)), int(math.ceil(pos))
              if lo == hi:
                  return xs[lo]
              return xs[lo]*(hi-pos)+xs[hi]*(pos-lo)

          global_q = {str(p): q(smooth,p) for p in (0.05,0.10,0.20,0.50)}
          duration = len(samples)/rate

          segments = [
              {
                  "segment":"NEIL_LONG_DIALOGUE",
                  "start":6.550, "end":19.700,
                  "shots":["N06","N02","N07","N03","N04"],
                  "phrases":[
                      "莫妮卡夫人正在教堂祈祷",
                      "请各位稍作休整",
                      "等夫人祈祷结束后",
                      "她会来和大家共进晚餐",
                      "希望各位能对今晚的安排满意"
                  ]
              },
              {
                  "segment":"NARRATION_CASTLE_TO_ENTRY",
                  "start":19.700, "end":30.030,
                  "shots":["N08","N09","N10","N05"],
                  "phrases":[
                      "巨大的褐色古堡前",
                      "一名西装笔挺的管家",
                      "对着面前的众人微微一笑",
                      "旋身迈进了古堡大门"
                  ]
              }
          ]

          def candidate_near(target, window=0.90):
              lo = max(0, int((target-window)*100))
              hi = min(len(smooth)-1, int((target+window)*100))
              # Prefer true valley; tiny penalty discourages drifting too far from semantic rough target.
              best = None
              for idx in range(lo, hi+1):
                  t = idx/100.0
                  e = smooth[idx]
                  score = e + abs(t-target)*global_q["0.50"]*0.06
                  if best is None or score < best[0]:
                      best=(score,t,e)
              return best[1],best[2]

          rows=[]
          for seg in segments:
              lengths=[len(x) for x in seg["phrases"]]
              total=sum(lengths)
              cumulative=0
              for i in range(len(seg["shots"])-1):
                  cumulative += lengths[i]
                  rough = seg["start"] + (seg["end"]-seg["start"])*(cumulative/total)
                  selected, energy = candidate_near(rough)
                  # energy percentile against full opening envelope
                  pct=sum(1 for x in smooth if x <= energy)/len(smooth)
                  rows.append({
                      "boundary_id":f"{seg['shots'][i]}->{seg['shots'][i+1]}",
                      "from_shot":seg["shots"][i],
                      "to_shot":seg["shots"][i+1],
                      "segment":seg["segment"],
                      "rough_semantic_target_sec":round(rough,3),
                      "acoustic_candidate_sec":round(selected,3),
                      "candidate_offset_sec":round(selected-rough,3),
                      "smoothed_rms":round(energy,3),
                      "opening_energy_percentile":round(pct,4),
                      "method":"text-proportional semantic target + nearest low-energy valley within ±0.90s"
                  })

          fixed = [
              {"boundary_id":"START->A01","sec":0.000,"status":"VERIFIED_TRANSCRIPT_BOUNDARY"},
              {"boundary_id":"A01->A02","sec":3.250,"status":"VERIFIED_TRANSCRIPT_BOUNDARY"},
              {"boundary_id":"A02->N06","sec":6.550,"status":"VERIFIED_TRANSCRIPT_BOUNDARY"},
              {"boundary_id":"N04->N08","sec":19.700,"status":"VERIFIED_TRANSCRIPT_BOUNDARY"},
              {"boundary_id":"N05->N01","sec":30.030,"status":"VERIFIED_TRANSCRIPT_BOUNDARY"},
              {"boundary_id":"N01->END","sec":33.020,"status":"VERIFIED_TRANSCRIPT_BOUNDARY"}
          ]

          with open("out/opening_v2_candidate_cut_points.csv","w",newline="",encoding="utf-8-sig") as f:
              wr=csv.DictWriter(f,fieldnames=list(rows[0].keys()))
              wr.writeheader(); wr.writerows(rows)

          payload={
              "analysis_scope_sec":[0.000,33.020],
              "source_audio_rule":"canonical source audio; no speed change",
              "fixed_verified_boundaries":fixed,
              "candidate_internal_boundaries":rows,
              "global_energy_quantiles":global_q,
              "notes":[
                  "Internal boundaries are acoustic candidates, not director-locked edit points.",
                  "No ASR was used; canonical transcript semantics supply rough targets and low-energy valleys refine them.",
                  "Final cut points require Chat/director review against story function and, if needed, human listening QC."
              ]
          }
          with open("out/opening_v2_audio_alignment_analysis.json","w",encoding="utf-8") as f:
              json.dump(payload,f,ensure_ascii=False,indent=2)

          with open("out/opening_v2_energy_envelope.csv","w",newline="",encoding="utf-8") as f:
              wr=csv.writer(f); wr.writerow(["time_sec","smoothed_rms"])
              for i,e in enumerate(smooth):
                  wr.writerow([f"{i/100:.3f}",f"{e:.3f}"])

          with open("out/analysis_summary.md","w",encoding="utf-8") as f:
              f.write("# Opening V2 Audio Alignment Analysis\n\n")
              f.write("## Fixed verified transcript boundaries\n\n")
              for x in fixed:
                  f.write(f"- {x['boundary_id']}: {x['sec']:.3f}s — {x['status']}\n")
              f.write("\n## Internal acoustic candidates\n\n")
              f.write("| Boundary | Rough target | Acoustic candidate | Offset | Energy percentile |\n")
              f.write("|---|---:|---:|---:|---:|\n")
              for x in rows:
                  f.write(f"| {x['boundary_id']} | {x['rough_semantic_target_sec']:.3f}s | {x['acoustic_candidate_sec']:.3f}s | {x['candidate_offset_sec']:+.3f}s | {x['opening_energy_percentile']:.1%} |\n")
              f.write("\nThese are candidates only. Final director cut points are not auto-approved.\n")

          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY

      - name: Publish analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: P03_OPENING_V2_AUDIO_ALIGNMENT_ANALYSIS_V001
          path: out/
          retention-days: 7
          if-no-files-found: error

      - name: Job summary
        shell: bash
        run: |
          cat out/analysis_summary.md >> "$GITHUB_STEP_SUMMARY"
