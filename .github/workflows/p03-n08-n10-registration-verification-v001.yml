name: P03 N08-N10 Registration Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n08-n10-registration-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify N08 N09 N10 approved PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct

          ROOT = pathlib.Path.cwd()
          files = [
              ("N08", ROOT/"production/image_library/approved/story_shots/N08_CASTLE_ENTRANCE_ARCHITECTURE_APPROVED_V001.png"),
              ("N09", ROOT/"production/image_library/approved/story_shots/N09_NEIL_FORMAL_BUTLER_DESCRIPTOR_APPROVED_V001.png"),
              ("N10", ROOT/"production/image_library/approved/story_shots/N10_NEIL_SUBTLE_SMILE_APPROVED_V001.png"),
          ]

          out = []
          for shot_id, p in files:
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"{shot_id}: missing or redirected file: {p}")
              data = p.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{shot_id}: invalid PNG")
              w,h = struct.unpack(">II", data[16:24])
              sha = hashlib.sha256(data).hexdigest()
              blob = hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              if (w,h)!=(941,1672):
                  raise SystemExit(f"{shot_id}: unexpected dimensions {(w,h)}")
              out.append({
                  "shot_id": shot_id,
                  "filename": p.name,
                  "path": p.as_posix(),
                  "byte_size": len(data),
                  "width": w,
                  "height": h,
                  "sha256": sha,
                  "git_blob_sha": blob,
              })
              print(f"{shot_id}_PASS")
              print(f"{shot_id}_BYTES={len(data)}")
              print(f"{shot_id}_SHA256={sha}")
              print(f"{shot_id}_GIT_BLOB={blob}")
              print(f"{shot_id}_DIMENSIONS={w}x{h}")

          pathlib.Path("N08_N10_REGISTRATION_VERIFICATION_V001.json").write_text(
              json.dumps({"result":"PASS","files":out}, indent=2)+"\n", encoding="utf-8"
          )
          print("OVERALL_RESULT=PASS")
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: N08_N10_REGISTRATION_VERIFICATION_V001
          path: N08_N10_REGISTRATION_VERIFICATION_V001.json
          retention-days: 7
          if-no-files-found: error
