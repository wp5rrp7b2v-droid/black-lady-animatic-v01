name: N03 Reference Delivery Bundle V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/n03-reference-delivery-bundle-v001.yml"

permissions:
  contents: read

jobs:
  build-reference-delivery-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build and verify N03 reference bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil

          ROOT = pathlib.Path.cwd().resolve()
          BUNDLE_ID = "N03_REFERENCE_DELIVERY_BUNDLE_V001"
          OUT = ROOT / BUNDLE_ID
          REFS = OUT / "references"
          SOURCE_COMMIT = os.environ["SOURCE_COMMIT"]

          items = [
            {
              "role":"SCENE_MASTER",
              "authority":"SCENE_AUTHORITY",
              "path":"production/image_library/scene_masters/castle_entrance/SCENE_CASTLE_ENTRANCE_SCENE_MASTER_DEFAULT_DAY_DOOR_OPEN_V001.png"
            },
            {
              "role":"N01_CONTINUITY",
              "authority":"SHOT_CONTINUITY",
              "path":"production/image_library/approved/story_shots/N01_CASTLE_PAUSE_APPROVED_V001.png"
            },
            {
              "role":"NING_FACE_FRONT",
              "authority":"CHARACTER_IDENTITY",
              "path":"production/image_library/character_references/ning_qiushui/CHAR_NING_QIUSHUI_FACE_FRONT_DEFAULT_DEFAULT_V001.png"
            },
            {
              "role":"NING_FACE_3Q_LEFT",
              "authority":"CHARACTER_IDENTITY",
              "path":"production/image_library/character_references/ning_qiushui/CHAR_NING_QIUSHUI_FACE_3Q_LEFT_DEFAULT_DEFAULT_V001.png"
            },
            {
              "role":"NING_BODY_FRONT",
              "authority":"CHARACTER_IDENTITY",
              "path":"production/image_library/character_references/ning_qiushui/CHAR_NING_QIUSHUI_BODY_FRONT_DEFAULT_DEFAULT_V001.png"
            },
            {
              "role":"JUN_FACE_FRONT",
              "authority":"CHARACTER_IDENTITY",
              "path":"production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_FACE_FRONT_DEFAULT_DEFAULT_V001.png"
            },
            {
              "role":"JUN_FACE_3Q_LEFT",
              "authority":"CHARACTER_IDENTITY",
              "path":"production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_FACE_3Q_LEFT_DEFAULT_DEFAULT_V001.png"
            },
            {
              "role":"JUN_BODY_FRONT",
              "authority":"CHARACTER_IDENTITY",
              "path":"production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_BODY_FRONT_DEFAULT_DEFAULT_V001.png"
            }
          ]

          def sha256(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(1024*1024), b""):
                      h.update(b)
              return h.hexdigest()

          if OUT.exists():
              raise SystemExit(f"Refusing to overwrite {OUT}")
          REFS.mkdir(parents=True)

          delivered=[]
          for item in items:
              src=ROOT/item["path"]
              if not src.is_file() or src.is_symlink():
                  raise SystemExit(f"Missing canonical file: {src}")
              dst=REFS/src.name
              shutil.copyfile(src,dst)
              if sha256(src)!=sha256(dst) or src.stat().st_size!=dst.stat().st_size:
                  raise SystemExit(f"Copy verification failed: {src}")
              delivered.append({
                  **item,
                  "filename":src.name,
                  "sha256":sha256(src),
                  "byte_size":src.stat().st_size,
                  "bundle_path":dst.relative_to(OUT).as_posix(),
                  "source_commit":SOURCE_COMMIT
              })

          manifest={
              "bundle_id":BUNDLE_ID,
              "working_shot_id":"N03",
              "source_commit":SOURCE_COMMIT,
              "reference_count":len(delivered),
              "authority_precedence":[
                  "SCENE_AUTHORITY",
                  "CHARACTER_IDENTITY",
                  "SHOT_CONTINUITY"
              ],
              "references":delivered,
              "overall_result":"PASS"
          }
          (OUT/"delivery_manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          (OUT/"WORK_HANDOFF.md").write_text(
              "# N03 Reference Delivery Bundle V001\n\n"
              "Use this artifact as the binary transport path for Work.\n"
              "Verify every PNG against delivery_manifest.json before generation.\n"
              "Do not use Cloud Browser or private raw GitHub URLs for these images.\n"
              "Scene Master defines scene facts; Character references define identity; "
              "N01 is continuity-only and must not dictate N03 camera composition.\n",
              encoding="utf-8"
          )
          print(f"PASS: {len(delivered)} exact PNG references bundled")
          PY

      - name: Upload N03 reference delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: N03_REFERENCE_DELIVERY_BUNDLE_V001
          path: N03_REFERENCE_DELIVERY_BUNDLE_V001/
          retention-days: 7
          if-no-files-found: error
