name: S02-B V019 Exact Approved Iteration Review Delivery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s02b-v019-exact-review-delivery-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export_exact_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify the exact archived V019 PO visually-approved review video
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          path=Path("production/video_candidates/v019_directors_cut/review/S02_B_V019_DIRECTORS_CUT_FULL_REVIEW_V001.mp4")
          assert path.is_file(), "SOURCE_MISSING"
          b=path.read_bytes()
          expect="b52476fc7201b31d7882475b755c6a41c1e2276690045bb1590e4e351c0bf28d"
          actual=hashlib.sha256(b).hexdigest()
          assert actual==expect, f"SHA256_MISMATCH expected={expect} actual={actual}"
          assert len(b)==25595015, f"BYTE_COUNT_MISMATCH:{len(b)}"
          assert len(b)>1000000, "POSSIBLE_LFS_POINTER"
          dest=Path("_s02b_v019_exact_review_delivery")
          dest.mkdir(exist_ok=True)
          shutil.copyfile(path,dest/path.name)
          (dest/"verification_manifest.json").write_text(json.dumps({
            "status":"EXACT_BINARY_SHA256_PASS",
            "source":str(path),"sha256":actual,"bytes":len(b),
            "approval_scope":"PO_VISUAL_APPROVED_INDEPENDENT_ITERATION_NOT_CANONICAL_MASTER"
          },indent=2)+"\n")
          print("V019_PO_APPROVED_REVIEW_EXACT_BINARY_PASS",actual,len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: S02B_V019_VISUAL_APPROVED_ORIGINAL_MP4_EXACT
          path: _s02b_v019_exact_review_delivery/
          if-no-files-found: error
          retention-days: 5
