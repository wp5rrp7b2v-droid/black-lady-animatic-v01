name: N16 Story Shot Registration Verification V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n16-story-shot-registration-verification-v001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N16 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          path = "production/image_library/approved/story_shots/N16_SISTER_QUESTION_APPROVED_V001.png"
          sha = "b26fb7d64a60fbd28d39b0ae22f7c85df18d4f947f31a3591c847dd5e1acf406"
          blob = "44971dd53e37cd1b582bcf5094b0f09cb8e0647d"

          b = Path(path).read_bytes()
          assert len(b) == 1942422
          assert hashlib.sha256(b).hexdigest() == sha
          assert subprocess.check_output(["git","hash-object",path], text=True).strip() == blob
          assert struct.unpack(">II", b[16:24]) == (941,1672)

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text().splitlines() if x.strip()]
          hits = [x for x in rows if x.get("shot_id") == "N16"]
          assert len(hits) == 1

          r = hits[0]
          assert r["canonical_path"] == path
          assert r["sha256_locked_identity"] == sha
          assert r["github_blob_sha"] == blob
          assert r["byte_size"] == 1942422
          assert r["dimensions"] == {"width":941,"height":1672}
          assert r["approval_status"] == "APPROVED"
          assert r["lifecycle"] == "CURRENT"
          assert r["title"] == "Sister Question"
          assert r["scene"] == "CASTLE_ENTRANCE"
          assert r["characters"] == ["NING_QIUSHUI","JUN_LUYUAN"]
          assert r["timeline"] == "01:18.750-01:28.120"

          assert not Path("古堡门内的低声交谈.png").exists()

          print("N16_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
