name: Project Control Dashboard R171 Patch

on:
  push:
    branches: [main]
    paths:
      - "production/control_requests/dashboard_r171_patch.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard to R171
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/project_control/dashboard/dashboard.html")
          s=p.read_text(encoding="utf-8")
          replacements=[
            ("Project Dashboard V105","Project Dashboard V106"),
            ("Derived from R170 · Updated 2026-10-01","Derived from R171 · Updated 2026-10-01"),
            ("P0.3｜S02-B ACTIVE｜N21 Candidate 05 已授权生成","P0.3｜S02-B ACTIVE｜N21 C05/C06 均未通过"),
            ("N21 Candidate 05 已获 Product Owner 正式生成授权：只允许 Clean Regeneration 生成 1 张 PNG，使用正式 Artifact 11145497260；完成后立即停下等待审核。",
             "N21 Candidate 05 与 Candidate 06 均未获批准。Style Reference 缓解有效，但入口尺度、色调/光位连续性与群体编排仍未解决；Candidate 07 未授权。"),
            ("Candidate 05 Work Generation / PO Review","Director Strategy Review"),
            ("N21 Candidate 04：NOT APPROVED；Candidate 05：AUTHORIZED FOR ONE WORK GENERATION；N22：NOT STARTED。",
             "N21 Candidate 04–06：NOT APPROVED；Candidate 07：NOT AUTHORIZED；N22：NOT STARTED。"),
            ("Candidate 01–04 均未通过｜Candidate 05 已授权生成 1 张",
             "Candidate 01–06 均未通过｜Candidate 07 未授权"),
            ("恢复点：等待 N21 Candidate 05 Work 输出并进行 Product Owner 审核；正式 Artifact 11145497260。",
             "恢复点：Director Strategy Review before Candidate 07；V004 仍技术有效。"),
            ("Next：Work 生成唯一一张 Candidate 05 后立即停止，进入 Product Owner Review；N22 不启动。",
             "Next：先重审入口尺度、光线/色调连续性与群体编排；Candidate 07 与 N22 均不启动。"),
            ("Project Control：R170。","Project Control：R171。"),
            ("S02-B｜ACTIVE / CANDIDATE 05 AUTHORIZED / PRODUCT OWNER REVIEW NEXT",
             "S02-B｜ACTIVE / C05-C06 NOT APPROVED / DIRECTOR STRATEGY REVIEW NEXT")
          ]
          for old,new in replacements:
              if old in s:
                  s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit dashboard sync
        run: |
          git config user.name "black-lady-project-control-bot"
          git config user.email "actions@github.com"
          git add docs/project_control/dashboard/dashboard.html
          git diff --cached --quiet && { echo "no dashboard change"; exit 1; }
          git commit -m "project-control: sync dashboard to R171"
          git push origin HEAD:main
