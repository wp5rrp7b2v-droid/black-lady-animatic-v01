name: S02-A Audio Boundary Analysis V001
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Extract S02-A analysis audio
        run: |
          mkdir -p out
          SRC="staging/p0_3_a01_a02_transition_validation/AUDIO_MVP1_CANONICAL_V001.m4a"
          test -f "$SRC"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$SRC"
          sha256sum "$SRC"
          ffmpeg -v error -y -ss 33.000 -to 70.900 -i "$SRC" -ac 1 -ar 16000 out/S02_A_BOUNDARY_ANALYSIS_0033_0110900.wav
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/S02_A_BOUNDARY_ANALYSIS_0033_0110900.wav
          sha256sum out/S02_A_BOUNDARY_ANALYSIS_0033_0110900.wav
      - uses: actions/upload-artifact@v4
        with:
          name: S02_A_AUDIO_BOUNDARY_ANALYSIS_V001
          path: out/S02_A_BOUNDARY_ANALYSIS_0033_0110900.wav
          retention-days: 7
