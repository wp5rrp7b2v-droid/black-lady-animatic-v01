name: Project Control Dashboard R166 Patch

on:
  push:
    branches: [main]
    paths:
      - "production/control_requests/dashboard_r166_patch.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch remaining dashboard drift
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("docs/project_control/dashboard/dashboard.html")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ("先完成 V003 Bundle 设计并单独审批；Bundle 未批准前不构建，Candidate 04 仍 NOT AUTHORIZED，N22 不启动。",
               "V003 已完成并用于 Candidate 04；Candidate 04 已拒绝。当前转入 CONTROLLED_REFERENCE + Bundle V004 设计，Candidate 05 与 N22 均不启动。"),
              ("N21 Candidate 04：NOT AUTHORIZED；N22：NOT STARTED。",
               "N21 Candidate 04：NOT APPROVED；Candidate 05：NOT AUTHORIZED；N22：NOT STARTED。"),
              ("Candidate 01–03 未通过｜Candidate 04 未授权",
               "Candidate 01–04 均未通过｜Candidate 05 未授权"),
              ("Next：Style Reference exact-binary canonical publication + verification；Candidate 05 与 N22 均不启动。",
               "Next：CONTROLLED_REFERENCE delivery support + N21 Bundle V004 Design；Candidate 05 与 N22 均不启动。"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"missing expected dashboard text: {old}")
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit dashboard sync
        run: |
          git config user.name "black-lady-project-control-bot"
          git config user.email "actions@github.com"
          git add docs/project_control/dashboard/dashboard.html
          git diff --cached --quiet && { echo "no dashboard change"; exit 1; }
          git commit -m "project-control: finish dashboard R166 sync"
          git push origin HEAD:main
