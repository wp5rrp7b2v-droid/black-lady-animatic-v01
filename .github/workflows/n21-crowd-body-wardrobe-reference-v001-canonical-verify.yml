name: N21 Crowd Body Wardrobe Reference V001 Canonical Verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/n21-crowd-body-wardrobe-reference-v001-canonical-verify.yml"
      - "production/human_references/n21_crowd_body_wardrobe/N21_CROWD_BODY_WARDROBE_REFERENCE_V001.png"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify canonical exact binary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, subprocess

          p = Path("production/human_references/n21_crowd_body_wardrobe/N21_CROWD_BODY_WARDROBE_REFERENCE_V001.png")
          expected_size = 1418940
          expected_sha = "73bb645e5a22cccb53faf8eb2d4b8fc0b876980e7520a2bc54daab1207439dc6"
          expected_blob = "2b86ab207ee60ba0cd2de277bb55900b8854099c"
          expected_dims = (1536,1024)
          expected_mode = "RGBA"

          if not p.is_file():
              raise SystemExit("FAIL: canonical PNG missing")

          data = p.read_bytes()
          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          blob = subprocess.check_output(["git","hash-object",str(p)], text=True).strip()

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("FAIL: PNG signature mismatch")

          width,height = struct.unpack(">II", data[16:24])
          bit_depth = data[24]
          color_type = data[25]
          mode = {0:"L",2:"RGB",3:"P",4:"LA",6:"RGBA"}.get(color_type,f"UNKNOWN_{color_type}")

          checks = {
              "byte_size": size == expected_size,
              "sha256": sha == expected_sha,
              "git_blob": blob == expected_blob,
              "dimensions": (width,height) == expected_dims,
              "mode": mode == expected_mode,
              "bit_depth": bit_depth == 8,
          }

          for k,v in checks.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")

          print(f"actual_size={size}")
          print(f"actual_sha256={sha}")
          print(f"actual_git_blob={blob}")
          print(f"actual_dimensions={width}x{height}")
          print(f"actual_mode={mode}")
          print(f"actual_bit_depth={bit_depth}")

          if not all(checks.values()):
              raise SystemExit("EXACT_BINARY_MATCH=NO")
          print("EXACT_BINARY_MATCH=YES")
          print("OVERALL_RESULT=PASS")
          PY
