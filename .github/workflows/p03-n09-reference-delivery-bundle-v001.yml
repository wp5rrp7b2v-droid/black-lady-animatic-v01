name: P03 N09 Reference Delivery Bundle V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n09-reference-delivery-bundle-v001.yml"

permissions:
  contents: read

jobs:
  build-delivery-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify canonical N09 references and build bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import struct

          ROOT = pathlib.Path.cwd().resolve()
          SOURCE_COMMIT = os.environ["SOURCE_COMMIT"]
          BUNDLE_ID = "N09_REFERENCE_DELIVERY_BUNDLE_V001"
          OUT = ROOT / BUNDLE_ID
          REFS = OUT / "visual_refs"

          REGISTRY_PATH = ROOT / "production/asset_registry/asset_registry.jsonl"
          STORY_INDEX_PATH = ROOT / "production/story_shots/story_shot_index.jsonl"

          SCENE = {
              "asset_id": "AST_IMG_000052",
              "entity_id": "SCENE_CASTLE_ENTRANCE",
              "role": "SCENE_MASTER",
              "authority_class": "MASTER",
              "resolver_usage": "CONDITIONAL",
              "approval_status": "APPROVED",
              "lifecycle": "CURRENT",
              "sha256": "d49af6a5e42d0867f2ffe4883e6af82f4d3777da3e96d788924cee2a9c743961",
              "byte_size": 2305753,
              "path": "production/image_library/scene_masters/castle_entrance/SCENE_CASTLE_ENTRANCE_SCENE_MASTER_DEFAULT_DAY_DOOR_OPEN_V001.png",
              "git_blob_sha": "e4dafe096f5c5c8782257030a5a659aeec7808f9",
              "responsibility": "SCENE_FACT_AUTHORITY",
          }

          SHOTS = {
              "A02": {
                  "approval_status": "APPROVED",
                  "lifecycle": "CURRENT",
                  "byte_size": 2359724,
                  "path": "production/image_library/approved/A_Series/A02_REBOOT_approved_v001.png",
                  "git_blob_sha": "af1d5758a63ab05a648b6ada3c3d940a22a3145a",
                  "sha256": None,
                  "responsibility": "NEIL_IDENTITY_AND_OPENING_CONTINUITY",
              },
              "N04": {
                  "approval_status": "APPROVED",
                  "lifecycle": "CURRENT",
                  "byte_size": 2286766,
                  "path": "production/image_library/approved/story_shots/N04_NEIL_WELCOME_CLOSING_APPROVED_V001.png",
                  "git_blob_sha": "f071e169c776b16c050d615aa39e445aff1f5e71",
                  "sha256": "183a409864b2c58186cfa34896e459cd6491e67098c0810614205eca9b534e02",
                  "responsibility": "NEIL_FORMAL_POSTURE_AND_COSTUME_CONTINUITY",
              },
          }

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          def git_blob_sha(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def png_dimensions(data):
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("Invalid PNG signature")
              return struct.unpack(">II", data[16:24])

          if OUT.exists() or OUT.is_symlink():
              raise SystemExit(f"Refusing to overwrite bundle path: {OUT}")
          REFS.mkdir(parents=True)

          registry_rows = [
              json.loads(line)
              for line in REGISTRY_PATH.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          scene_rows = [row for row in registry_rows if row.get("asset_id") == SCENE["asset_id"]]
          if len(scene_rows) != 1:
              raise SystemExit(f"Scene Master registry cardinality mismatch: {len(scene_rows)}")
          scene_row = scene_rows[0]
          scene_checks = {
              "entity_id": scene_row.get("entity_id") == SCENE["entity_id"],
              "role": scene_row.get("role") == SCENE["role"],
              "authority_class": scene_row.get("authority_class") == SCENE["authority_class"],
              "resolver_usage": scene_row.get("resolver_usage") == SCENE["resolver_usage"],
              "approval_status": scene_row.get("approval_status") == SCENE["approval_status"],
              "lifecycle": scene_row.get("lifecycle") == SCENE["lifecycle"],
              "sha256": scene_row.get("sha256") == SCENE["sha256"],
              "byte_size": scene_row.get("byte_size") == SCENE["byte_size"],
              "storage_uri": scene_row.get("storage_uri") == SCENE["path"],
          }
          if not all(scene_checks.values()):
              raise SystemExit(f"Scene Master registry validation failed: {scene_checks}")

          story_rows = [
              json.loads(line)
              for line in STORY_INDEX_PATH.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          refs = []

          def validate_and_copy_story(shot_id, exp):
              rows = [row for row in story_rows if row.get("shot_id") == shot_id]
              if len(rows) != 1:
                  raise SystemExit(f"{shot_id} Story Shot index cardinality mismatch: {len(rows)}")
              row = rows[0]
              checks = {
                  "approval_status": row.get("approval_status") == exp["approval_status"],
                  "lifecycle": row.get("lifecycle") == exp["lifecycle"],
                  "canonical_path": row.get("canonical_path") == exp["path"],
                  "byte_size": row.get("byte_size") == exp["byte_size"],
                  "github_blob_sha": row.get("github_blob_sha") == exp["git_blob_sha"],
              }
              if exp["sha256"] is not None:
                  checks["locked_sha256"] = row.get("sha256_locked_identity") == exp["sha256"]
              if not all(checks.values()):
                  raise SystemExit(f"{shot_id} Story Shot index validation failed: {checks}")

              src = ROOT / exp["path"]
              if not src.is_file() or src.is_symlink():
                  raise SystemExit(f"Missing or redirected {shot_id} binary")
              data = src.read_bytes()
              actual_sha = sha256_bytes(data)
              actual_blob = git_blob_sha(data)
              width, height = png_dimensions(data)
              if len(data) != exp["byte_size"]:
                  raise SystemExit(f"{shot_id} byte-size mismatch")
              if actual_blob != exp["git_blob_sha"]:
                  raise SystemExit(f"{shot_id} Git blob mismatch")
              if exp["sha256"] is not None and actual_sha != exp["sha256"]:
                  raise SystemExit(f"{shot_id} SHA-256 mismatch")

              dst = REFS / f"{shot_id}__{src.name}"
              shutil.copyfile(src, dst)
              copied = dst.read_bytes()
              if copied != data:
                  raise SystemExit(f"{shot_id} byte-identical copy failed")

              refs.append({
                  "asset_id": None,
                  "shot_id": shot_id,
                  "role": "STORY_SHOT_CONTINUITY",
                  "responsibility": exp["responsibility"],
                  "approval_status": exp["approval_status"],
                  "lifecycle": exp["lifecycle"],
                  "canonical_path": exp["path"],
                  "filename": src.name,
                  "bundle_path": dst.relative_to(OUT).as_posix(),
                  "sha256": actual_sha,
                  "byte_size": len(data),
                  "git_blob_sha": actual_blob,
                  "width": width,
                  "height": height,
                  "source_commit": SOURCE_COMMIT,
              })

          validate_and_copy_story("A02", SHOTS["A02"])
          validate_and_copy_story("N04", SHOTS["N04"])

          scene_src = ROOT / SCENE["path"]
          if not scene_src.is_file() or scene_src.is_symlink():
              raise SystemExit("Missing or redirected Scene Master binary")
          scene_data = scene_src.read_bytes()
          scene_sha = sha256_bytes(scene_data)
          scene_blob = git_blob_sha(scene_data)
          scene_w, scene_h = png_dimensions(scene_data)
          if scene_sha != SCENE["sha256"]:
              raise SystemExit("Scene Master SHA-256 mismatch")
          if len(scene_data) != SCENE["byte_size"]:
              raise SystemExit("Scene Master byte-size mismatch")
          if scene_blob != SCENE["git_blob_sha"]:
              raise SystemExit("Scene Master Git blob mismatch")

          scene_dst = REFS / f"SCENE__{scene_src.name}"
          shutil.copyfile(scene_src, scene_dst)
          if scene_dst.read_bytes() != scene_data:
              raise SystemExit("Scene Master byte-identical copy failed")
          refs.append({
              "asset_id": SCENE["asset_id"],
              "shot_id": None,
              "role": SCENE["role"],
              "responsibility": SCENE["responsibility"],
              "approval_status": SCENE["approval_status"],
              "lifecycle": SCENE["lifecycle"],
              "canonical_path": SCENE["path"],
              "filename": scene_src.name,
              "bundle_path": scene_dst.relative_to(OUT).as_posix(),
              "sha256": scene_sha,
              "byte_size": len(scene_data),
              "git_blob_sha": scene_blob,
              "width": scene_w,
              "height": scene_h,
              "source_commit": SOURCE_COMMIT,
          })

          if len(refs) != 3:
              raise SystemExit(f"Reference count mismatch: {len(refs)}")

          manifest = {
              "bundle_id": BUNDLE_ID,
              "working_shot_id": "N09",
              "source_commit": SOURCE_COMMIT,
              "reference_count": 3,
              "reference_policy": "MINIMUM_NECESSARY_REFERENCES",
              "authority_precedence": [
                  "NEIL_IDENTITY_AND_OPENING_CONTINUITY",
                  "NEIL_FORMAL_POSTURE_AND_COSTUME_CONTINUITY",
                  "SCENE_FACT_AUTHORITY",
              ],
              "manual_product_owner_reference_upload": 0,
              "references": refs,
              "overall_result": "PASS",
          }

          (OUT / "delivery_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          (OUT / "WORK_HANDOFF.md").write_text(
              "# N09 Reference Delivery Bundle V001\n\n"
              "Purpose: formal binary transport for ChatGPT Work N09 Formal Butler Descriptor Story Shot generation.\n\n"
              "Locked chain: GitHub canonical assets -> Resolver / Registry validation -> "
              "Reference Delivery Bundle -> Work automatic PNG acquisition -> image generation.\n\n"
              "Rules:\n"
              "1. Revalidate all 3 PNGs against delivery_manifest.json before generation.\n"
              "2. Do not re-encode, resize, screenshot, or modify reference PNGs.\n"
              "3. A02 controls Neil identity and current Opening continuity.\n"
              "4. N04 controls Neil formal posture/costume continuity; do not simply reproduce N04 composition.\n"
              "5. Scene Master controls castle-entrance architectural facts and door-open state.\n"
              "6. N09 is a character-descriptor Story Shot, not a speaking, smiling, or turning action shot.\n"
              "7. Use minimum necessary references only; do not add character atomics unless a later revision explicitly requires them.\n"
              "8. If any reference fails SHA/byte/blob verification, fail closed.\n"
              "9. Product Owner manual reference upload count = 0.\n"
              "10. This artifact is transport evidence only, not a formal Asset.\n",
              encoding="utf-8",
          )

          print("PASS: 3/3 exact canonical reference binaries verified")
          for ref in refs:
              print(f"{ref.get('shot_id') or ref.get('asset_id')} SHA256={ref['sha256']}")
          print(f"BUNDLE_ID={BUNDLE_ID}")
          print(f"SOURCE_COMMIT={SOURCE_COMMIT}")
          PY

      - name: Upload N09 reference delivery artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: N09_REFERENCE_DELIVERY_BUNDLE_V001
          path: N09_REFERENCE_DELIVERY_BUNDLE_V001/
          retention-days: 7
          if-no-files-found: error

      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
