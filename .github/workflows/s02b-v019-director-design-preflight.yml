name: S02-B V019 Director Design and Renderer Preflight
on:
  push:
    branches:
      - feature/s02b-v019-directors-cut-20261018
    paths:
      - ".github/workflows/s02b-v019-director-design-preflight.yml"
      - "production/editorial_specs/S02_B_V019_DIRECTORS_CUT_EDL_V001.json"
      - "scripts/s02b_v019_directors_cut_renderer.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax and EDL invariants
        run: |
          python3 -m py_compile scripts/s02b_v019_directors_cut_renderer.py
          python3 - <<'PY'
          import json,pathlib
          e=json.loads(pathlib.Path('production/editorial_specs/S02_B_V019_DIRECTORS_CUT_EDL_V001.json').read_text())
          shots=e["segments"]
          assert len(shots)==19
          assert sum(x["duration_frames"] for x in shots)==1927
          assert len([x for x in shots if x["type"]=="still"])==3
          assert [x["id"] for x in shots[10:14]] == ["N21","V006_NEW_02","N22_FIRST","N23"]
          assert [(x["source_frame_start"],x["source_frame_end_exclusive"]) for x in shots if x["type"]=="still"]==[(164,281),(426,519),(519,658)]
          assert e["soundtrack"]["policy"]=="COPY_EXACT_AAC_PACKET_STREAM_ZERO_RETIME_ZERO_MIX"
          print("DESIGN_PASS: 19 segments / 1927 frames / 3 Work images / approved middle order.")
          PY
      - name: Verify source exact binary and frame count
        run: |
          test "$(sha256sum production/environment_dynamic/review_candidates/S02_B_M01_V018_FULL_LENGTH_C_VISIBLE_REVIEW/S02_B_M01_V018_FULL_LENGTH_MORE_VISIBLE_C_GROUP_PREVIEW_V001.mp4 | cut -d' ' -f1)" = "6897b1ac246e4c30d84aca3b80003a58d7bae86eb7631272fe28253b23a01427"
          echo "SOURCE_EXACT_SHA256_PASS"
