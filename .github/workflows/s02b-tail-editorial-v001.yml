name: S02-B Tail 42s Editorial Review V001 (NONCANONICAL)
on:
  push:
    branches:
      - review/s02b-tail-quality-v001-20261012
    paths:
      - review_tools/build_s02b_tail_editorial_v001.py
      - .github/workflows/s02b-tail-editorial-v001.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-tail-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow
      - name: Verify canonical assets and render noncanonical tail
        run: RUNNER_TEMP="$PWD" python3 review_tools/build_s02b_tail_editorial_v001.py
      - name: Upload full tail test with proof
        uses: actions/upload-artifact@v4
        with:
          name: S02B_TAIL_42S_EDITORIAL_REVIEW_V001
          path: |
            S02B_TAIL_42S_EDITORIAL_REVIEW_V001/S02B_TAIL_42S_EDITORIAL_REVIEW_V001.mp4
            S02B_TAIL_42S_EDITORIAL_REVIEW_V001/S02B_TAIL_42S_AUDIO_REVIEW.mp3
            S02B_TAIL_42S_EDITORIAL_REVIEW_V001/S02B_TAIL_12_VISUAL_PHASES.jpg
            S02B_TAIL_42S_EDITORIAL_REVIEW_V001/RENDER_MANIFEST.json
          retention-days: 7
          if-no-files-found: error
