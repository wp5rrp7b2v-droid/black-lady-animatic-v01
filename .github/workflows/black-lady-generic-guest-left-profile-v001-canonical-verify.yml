name: Generic Guest Crowd LEFT PROFILE V001 Canonical Verify

on:
  push:
    branches: [main]
    paths:
      - "production/human_references/generic_guest_crowd_core_set_v001/BLACK_LADY_GENERIC_GUEST_CROWD_CORE_SET_V001_LEFT_PROFILE.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify canonical exact approved LEFT PROFILE binary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, subprocess

          p = Path("production/human_references/generic_guest_crowd_core_set_v001/BLACK_LADY_GENERIC_GUEST_CROWD_CORE_SET_V001_LEFT_PROFILE.png")
          expected_size = 1686189
          expected_sha = "15cc28a4cc54dd32ba9fdf7825be6a9402f22b1be19d59e74d1ad1656d238ba1"
          expected_blob = "67d07640938163d53af347c4cd4988c2554ffe91"
          expected_dims = (1536, 1024)
          expected_mode = "RGB"

          if not p.is_file():
              raise SystemExit("FAIL: canonical LEFT PROFILE missing")

          data = p.read_bytes()
          size = len(data)
          sha = hashlib.sha256(data).hexdigest()
          blob = subprocess.check_output(["git","hash-object",str(p)], text=True).strip()

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("FAIL: PNG signature mismatch")
          width, height = struct.unpack(">II", data[16:24])
          bit_depth = data[24]
          color_type = data[25]
          mode = {0:"L",2:"RGB",3:"P",4:"LA",6:"RGBA"}.get(color_type, f"UNKNOWN_{color_type}")

          checks = {
              "byte_size": size == expected_size,
              "sha256": sha == expected_sha,
              "git_blob": blob == expected_blob,
              "dimensions": (width,height) == expected_dims,
              "mode": mode == expected_mode,
              "bit_depth": bit_depth == 8,
          }
          for k,v in checks.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")

          print(f"actual_size={size}")
          print(f"actual_sha256={sha}")
          print(f"actual_git_blob={blob}")
          print(f"actual_dimensions={width}x{height}")
          print(f"actual_mode={mode}")
          print(f"actual_bit_depth={bit_depth}")

          if not all(checks.values()):
              raise SystemExit("EXACT_BINARY_MATCH=NO")
          print("EXACT_BINARY_MATCH=YES")
          print("OVERALL_RESULT=PASS")
          PY
