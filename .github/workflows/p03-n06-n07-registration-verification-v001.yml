name: P03 N06-N07 Registration Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n06-n07-registration-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify N06 N07 approved PNGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct

          ROOT = pathlib.Path.cwd()
          files = [
              ("N06", ROOT/"production/image_library/approved/story_shots/N06_NEIL_SPEAKING_STATE_A_APPROVED_V001.png",
               1851865, "50f17c152477cef2fcdc8e1a61e5a7c42f5d32512e19c92bdbed544d465effc5",
               "aa43a519fe7953a9626d47f71acf76908ed40389"),
              ("N07", ROOT/"production/image_library/approved/story_shots/N07_NEIL_SPEAKING_STATE_C_APPROVED_V001.png",
               1983362, "fc2d4f7f09a1c7cc8012176ef885d3f4b3ae449741b3bd2d4ad075fb91188dd9",
               "379b8a209a8d6da709dc15bcb645972016176169"),
          ]

          index_path = ROOT/"production/story_shots/story_shot_index.jsonl"
          index_rows = [json.loads(x) for x in index_path.read_text(encoding="utf-8").splitlines() if x.strip()]
          by_id = {row.get("shot_id"): row for row in index_rows}

          out = []
          for shot_id, p, exp_bytes, exp_sha, exp_blob in files:
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"{shot_id}: missing or redirected file: {p}")
              data = p.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{shot_id}: invalid PNG")
              w,h = struct.unpack(">II", data[16:24])
              sha = hashlib.sha256(data).hexdigest()
              blob = hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              if (w,h)!=(941,1672):
                  raise SystemExit(f"{shot_id}: unexpected dimensions {(w,h)}")
              if len(data)!=exp_bytes or sha!=exp_sha or blob!=exp_blob:
                  raise SystemExit(f"{shot_id}: canonical identity mismatch")
              row = by_id.get(shot_id)
              if not row:
                  raise SystemExit(f"{shot_id}: missing from Story Shot index")
              checks = {
                  "approval_status": row.get("approval_status") == "APPROVED",
                  "lifecycle": row.get("lifecycle") == "CURRENT",
                  "canonical_path": row.get("canonical_path") == p.relative_to(ROOT).as_posix(),
                  "byte_size": row.get("byte_size") == exp_bytes,
                  "dimensions": row.get("dimensions") == {"width":941,"height":1672},
                  "github_blob_sha": row.get("github_blob_sha") == exp_blob,
                  "sha256_locked_identity": row.get("sha256_locked_identity") == exp_sha,
                  "rename_preserved_exact_git_blob": row.get("rename_preserved_exact_git_blob") is True,
              }
              if not all(checks.values()):
                  raise SystemExit(f"{shot_id}: Story Shot index mismatch: {checks}")
              out.append({
                  "shot_id": shot_id,
                  "filename": p.name,
                  "path": p.relative_to(ROOT).as_posix(),
                  "byte_size": len(data),
                  "width": w,
                  "height": h,
                  "sha256": sha,
                  "git_blob_sha": blob,
                  "story_shot_index_match": True,
              })
              print(f"{shot_id}_PASS")
              print(f"{shot_id}_BYTES={len(data)}")
              print(f"{shot_id}_SHA256={sha}")
              print(f"{shot_id}_GIT_BLOB={blob}")
              print(f"{shot_id}_DIMENSIONS={w}x{h}")
              print(f"{shot_id}_INDEX_MATCH=YES")

          pathlib.Path("N06_N07_REGISTRATION_VERIFICATION_V001.json").write_text(
              json.dumps({"result":"PASS","files":out}, indent=2)+"\n", encoding="utf-8"
          )
          print("OVERALL_RESULT=PASS")
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: N06_N07_REGISTRATION_VERIFICATION_V001
          path: N06_N07_REGISTRATION_VERIFICATION_V001.json
          retention-days: 7
          if-no-files-found: error
