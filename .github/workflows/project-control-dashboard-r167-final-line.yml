name: Project Control Dashboard R167 Final Line

on:
  push:
    branches: [main]
    paths:
      - "production/control_requests/dashboard_r167_final_line.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch one stale dashboard line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/project_control/dashboard/dashboard.html")
          s=p.read_text(encoding="utf-8")
          old="Character Visual Style Reference V001 已 Product Owner 批准、canonical publication、远端 exact-binary verification PASS。下一步设计 CONTROLLED_REFERENCE delivery + N21 Bundle V004；Candidate 05 仍未授权。"
          new="N21 Bundle V004 Design V0.1 已 Product Owner 批准并锁定。下一步等待 CONTROLLED_REFERENCE Builder Support + V004 Spec / Build Preparation 授权；Candidate 05 仍未授权。"
          if old not in s:
              raise SystemExit("expected stale line not found")
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "black-lady-project-control-bot"
          git config user.email "actions@github.com"
          git add docs/project_control/dashboard/dashboard.html
          git commit -m "project-control: finalize dashboard R167 wording"
          git push origin HEAD:main
