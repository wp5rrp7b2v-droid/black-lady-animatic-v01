name: Opening P03-B and P04-C Story Shot Registration Verification V001
on:
  push:
    branches: [main]
    paths:
      - "production/story_shots/story_shot_index.jsonl"
      - ".github/workflows/opening-p03bc-registration-verification-v001.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact binaries, shot registration and scene continuity
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, struct, subprocess
          root=pathlib.Path(".")
          pairs=[
            ("OPENING_P03B","production/image_library/approved/story_shots/OPENING_P03B_TASK_MAIN_APPROVED_V001.png",941,1670,3113918,"ad7ae095a11fcce8772c1d2694683bc0f15336294a35bd7a3d12480c6d58e98e","067e60b7ff538700cc71c64d629ec6a80eaccec1"),
            ("OPENING_P04C","production/image_library/approved/story_shots/OPENING_P04C_HINTS_MAIN_APPROVED_V001.png",941,1672,3364032,"6a00e7a76ed8a7e228dc2ab334e93a7f907b586293a144649773f4f9c29628be","926a4a2a4025187fa254ee0cb1a3ac65a0a35e33")
          ]
          idx=[json.loads(line) for line in (root/"production/story_shots/story_shot_index.jsonl").read_text().splitlines() if line.strip()]
          assert len(idx)==35, f"EXPECTED_35_SHOTS: {len(idx)}"
          scene=json.loads((root/"production/controlled_references/opening_p03a/OPENING_P03A_GHOST_HOUSE_BLOOD_DOOR_SCENE_ANCHOR_V001.manifest.json").read_text())
          assert scene["output"]["git_blob"]=="de5c887817e6182bd64c7584578e2b342cff0699"
          ids=[row["shot_id"] for row in idx]
          assert len(ids)==len(set(ids)), "DUPLICATE_SHOT_ID"
          for sid,rel,w,h,size,sha,blob in pairs:
            p=root/rel
            assert p.is_file() and not p.is_symlink(), "SOURCE_NOT_FOUND"
            b=p.read_bytes()
            assert b[:8]==b"\x89PNG\r\n\x1a\n", "BAD_PNG"
            aw,ah=struct.unpack(">II",b[16:24])
            computed_sha=hashlib.sha256(b).hexdigest()
            computed_blob=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
            assert (aw,ah,len(b),computed_sha,computed_blob)==(w,h,size,sha,blob),f"{sid}_BINARY_MISMATCH"
            rows=[x for x in idx if x["shot_id"]==sid]
            assert len(rows)==1, f"{sid}_CARDINALITY_MISMATCH"
            row=rows[0]
            assert row["asset_class"]=="STORY_SHOT" and row["approval_status"]=="APPROVED" and row["lifecycle"]=="CURRENT"
            assert row["canonical_path"]==rel and row["byte_size"]==size and row["dimensions"]=={"width":w,"height":h}
            assert row["sha256_locked_identity"]==sha and row["github_blob_sha"]==blob
            assert row["rename_preserved_exact_git_blob"] is True
            assert row["scene_anchor"]["manifest_path"]=="production/controlled_references/opening_p03a/OPENING_P03A_GHOST_HOUSE_BLOOD_DOOR_SCENE_ANCHOR_V001.manifest.json"
            assert not (root/f"staging/story_shot_candidates/{sid}/{p.name.replace('_APPROVED_V001','_CANDIDATE_01')}").exists()
            print(f"{sid}_EXACT_BINARY_AND_INDEX_PASS")
          assert not (root/"staging/story_shot_candidates/OPENING_P03B/OPENING_P03B_TASK_MAIN_CANDIDATE_01.png").exists()
          assert not (root/"staging/story_shot_candidates/OPENING_P04C/OPENING_P04C_HINTS_MAIN_CANDIDATE_01.png").exists()
          assert len([x for x in idx if x["shot_id"]=="OPENING_P03A"])==1
          print("OPENING_P03BC_REGISTRATION_PASS")
          print("STORY_SHOT_INDEX_COUNT=35")
          print("P03B_SIZE=941x1670_EXACT_APPROVED")
          print("P04C_SIZE=941x1672_EXACT_APPROVED")
          print("NO_STAGING_REMAINS=YES")
          print("OVERALL_RESULT=PASS")
          PY
