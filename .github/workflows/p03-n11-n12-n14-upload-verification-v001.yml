name: P03 N11 N12 N14 Upload Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n11-n12-n14-upload-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify-uploaded-approved-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify N11 N12 N14 exact uploaded binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct

          ROOT=pathlib.Path.cwd()
          items=[
            {
              "shot_id":"N11",
              "path":"production/image_library/approved/story_shots/N11_FINAL_SOURCE_UPLOAD.png",
              "sha256":"09d45c1b27fbd2aea68c818677d9656a2ae7f39296f80f6db622118312aebcc5",
              "bytes":2538801,
              "blob":"f5efde465dcadd1490f2064c6db39e1d5f194dc6",
              "width":941,"height":1672
            },
            {
              "shot_id":"N12",
              "path":"production/image_library/approved/story_shots/N12_FINAL_SOURCE_UPLOAD.png",
              "sha256":"d94dc3623ba1abc55aa86c8b646d7876d097433bfadb70291bfa9c68cffc030b",
              "bytes":2434337,
              "blob":"853d04f5ed8a2e1845ce1dfa9cef5c02f123124b",
              "width":941,"height":1672
            },
            {
              "shot_id":"N14",
              "path":"production/image_library/approved/story_shots/N14_FINAL_SOURCE_UPLOAD.png",
              "sha256":"0474003a1d6d48a652935033f17560d0ee1d689caadbdb7d4af72560477844f1",
              "bytes":2500282,
              "blob":"e32c03bc21efcd0eda98d2e9868a64915583b19f",
              "width":941,"height":1672
            }
          ]
          def git_blob(data):
            return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          report={"source_commit":"${{ github.sha }}","items":[],"overall_result":"PASS"}
          for x in items:
            p=ROOT/x["path"]
            if not p.is_file() or p.is_symlink():
              raise SystemExit(f"{x['shot_id']}_FAIL file missing/not regular")
            b=p.read_bytes()
            if b[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit(f"{x['shot_id']}_FAIL PNG signature")
            w,h=struct.unpack(">II",b[16:24])
            actual={
              "shot_id":x["shot_id"],"path":x["path"],
              "sha256":hashlib.sha256(b).hexdigest(),
              "byte_size":len(b),"git_blob_sha":git_blob(b),
              "width":w,"height":h
            }
            ok=(actual["sha256"]==x["sha256"] and actual["byte_size"]==x["bytes"] and
                actual["git_blob_sha"]==x["blob"] and w==x["width"] and h==x["height"])
            if not ok:
              raise SystemExit(f"{x['shot_id']}_FAIL identity mismatch: {actual}")
            report["items"].append(actual)
            print(f"{x['shot_id']}_PASS SHA256={actual['sha256']} BYTES={len(b)} BLOB={actual['git_blob_sha']} SIZE={w}x{h}")
          print("OVERALL_RESULT=PASS")
          pathlib.Path("verification_report.json").write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: N11_N12_N14_UPLOAD_VERIFICATION_V001
          path: verification_report.json
          retention-days: 7
