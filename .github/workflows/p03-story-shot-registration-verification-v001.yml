name: P03 Story Shot Registration Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-story-shot-registration-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify uploaded N02-N05 binaries
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, struct, os
          root=pathlib.Path.cwd()
          items=[
            ("N02","production/image_library/approved/story_shots/fce8e9c7-b0ec-4b5d-881c-7041a0ee53df.png",2514132),
            ("N03","production/image_library/approved/story_shots/fb6dd04f-c1ac-46cd-9ea7-c39490deca24.png",2321221),
            ("N04","production/image_library/approved/story_shots/afd595c9-8d7f-42d1-98ad-7a1e7e93e30a.png",2286766),
            ("N05","production/image_library/approved/story_shots/6448627b-7959-4ba5-aaa3-a6019c42d59a.png",2383088),
          ]
          out=[]
          for shot,path_s,expected_bytes in items:
              p=root/path_s
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"{shot}: missing or redirected file: {path_s}")
              b=p.read_bytes()
              if b[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{shot}: invalid PNG signature")
              w,h=struct.unpack(">II",b[16:24])
              actual_bytes=len(b)
              sha256=hashlib.sha256(b).hexdigest()
              if actual_bytes != expected_bytes:
                  raise SystemExit(f"{shot}: byte_size mismatch actual={actual_bytes} expected={expected_bytes}")
              if (w,h)!=(941,1672):
                  raise SystemExit(f"{shot}: dimensions mismatch {(w,h)}")
              out.append({
                  "shot_id":shot,
                  "source_path":path_s,
                  "byte_size":actual_bytes,
                  "width":w,
                  "height":h,
                  "sha256":sha256,
              })
          print("P03_STORY_SHOT_REGISTRATION_VERIFICATION=PASS")
          print("SOURCE_COMMIT="+os.environ["SOURCE_COMMIT"])
          print("REFERENCE_COUNT=4")
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
