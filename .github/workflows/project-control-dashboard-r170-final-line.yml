name: Project Control Dashboard R170 Final Line

on:
  push:
    branches: [main]
    paths:
      - "production/control_requests/dashboard_r170_final_line.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale Candidate 05 line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/project_control/dashboard/dashboard.html")
          s=p.read_text(encoding="utf-8")
          old="V003 已完成并用于 Candidate 04；Candidate 04 已拒绝。当前转入 CONTROLLED_REFERENCE + Bundle V004 设计，Candidate 05 与 N22 均不启动。"
          new="V004 已正式构建并完成 2/2 exact verification。Candidate 05 已授权仅生成 1 张并等待 Product Owner 审核；N22 仍不启动。"
          if old not in s:
              raise SystemExit("expected stale line not found")
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "black-lady-project-control-bot"
          git config user.email "actions@github.com"
          git add docs/project_control/dashboard/dashboard.html
          git commit -m "project-control: finalize dashboard R170 candidate status"
          git push origin HEAD:main
