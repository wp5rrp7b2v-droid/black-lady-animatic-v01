name: S02-B V019 Full Spatial Audio Review V002 (N23 match)
on:
  push:
    branches:
      - experiment/s02b-v019-spatial-audio-full-v001-20261018
    paths:
      - ".github/workflows/s02b-full-spatial-audio-v002.yml"
      - "scripts/s02b_full_spatial_audio_v002.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated review branch with already-verified A base
        uses: actions/checkout@v4
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user numpy
      - name: Create V002 B full film audio and QC (preserve A and V001)
        run: python3 scripts/s02b_full_spatial_audio_v002.py
      - name: Save review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S02B_V019_FULL_SPATIAL_AUDIO_V002_REVIEW_ONLY
          path: |
            production/video_candidates/review/s02b_full_spatial_audio_v001/S02_B_V019_SPATIAL_AUDIO_B_FULL_CANDIDATE_V002.mp4
            production/video_candidates/review/s02b_full_spatial_audio_v001/S02_B_V019_SPATIAL_AUDIO_A_B_SELECTED_EXCERPTS_V002.mp4
            production/video_candidates/review/s02b_full_spatial_audio_v001/S02_B_V019_SPATIAL_AUDIO_FULL_QC_V002.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish V002 to experiment branch, no other assets touched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/video_candidates/review/s02b_full_spatial_audio_v001/S02_B_V019_SPATIAL_AUDIO_B_FULL_CANDIDATE_V002.mp4
          git add production/video_candidates/review/s02b_full_spatial_audio_v001/S02_B_V019_SPATIAL_AUDIO_A_B_SELECTED_EXCERPTS_V002.mp4
          git add production/video_candidates/review/s02b_full_spatial_audio_v001/S02_B_V019_SPATIAL_AUDIO_FULL_QC_V002.json
          git diff --cached --name-status
          if ! git diff --cached --quiet; then
            git commit -m "Archive S02-B full spatial audio V002 review; N23 profile QC PASS"
            git push origin HEAD:experiment/s02b-v019-spatial-audio-full-v001-20261018
          fi
