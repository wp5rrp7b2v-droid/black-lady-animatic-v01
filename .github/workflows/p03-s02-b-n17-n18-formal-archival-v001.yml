name: S02-B N17 N18 Formal Archival Closeout V001

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s02-b-n17-n18-formal-archival-v001
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact Binary Verification
        shell: python
        run: |
          from pathlib import Path
          import hashlib, struct, subprocess

          specs = [
              {
                  "shot": "N17",
                  "path": "N17_Candidate_03_APPROVED.png",
                  "size": 1671344,
                  "sha": "bd31599978d927cbd3748dc77073503c78cf87ccc68b21458de08625ebbfa3a3",
                  "blob": "c5020af8fa61225f0e4a88104990c1663fddcec9",
              },
              {
                  "shot": "N18",
                  "path": "城堡门外的晴天.png",
                  "size": 2158626,
                  "sha": "18746fdde8a3b7699061fd6f4a8a6b666d50001250a2df902bb3b5995e7e2613",
                  "blob": "039471efd721fa5f822c4fb8ec933b4893f91641",
              },
          ]

          for s in specs:
              p = Path(s["path"])
              b = p.read_bytes()
              assert b[:8] == b"\x89PNG\r\n\x1a\n", f'{s["shot"]}_PNG_SIGNATURE_FAIL'
              assert struct.unpack(">II", b[16:24]) == (941, 1672), f'{s["shot"]}_DIMENSIONS_FAIL'
              assert len(b) == s["size"], f'{s["shot"]}_BYTE_SIZE_FAIL'
              assert hashlib.sha256(b).hexdigest() == s["sha"], f'{s["shot"]}_SHA256_FAIL'
              blob = subprocess.check_output(["git", "hash-object", str(p)], text=True).strip()
              assert blob == s["blob"], f'{s["shot"]}_GIT_BLOB_FAIL'
              print(f'{s["shot"]}_EXACT_BINARY_PASS SHA_MATCH=YES BLOB_MATCH=YES DIMENSIONS_MATCH=YES')

          print("EXACT_BINARY_VERIFICATION=PASS")

      - name: Canonical Publication
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          N17_SRC="N17_Candidate_03_APPROVED.png"
          N17_DST="production/image_library/approved/story_shots/N17_BLOOD_DOOR_WARNING_APPROVED_V001.png"
          N18_SRC="城堡门外的晴天.png"
          N18_DST="production/image_library/approved/story_shots/N18_CLEAR_SKY_DOUBT_APPROVED_V001.png"

          test -f "$N17_SRC"
          test -f "$N18_SRC"
          test ! -e "$N17_DST"
          test ! -e "$N18_DST"

          mkdir -p "$(dirname "$N17_DST")"
          git mv "$N17_SRC" "$N17_DST"
          git mv "$N18_SRC" "$N18_DST"

          test "$(wc -c < "$N17_DST" | tr -d ' ')" = "1671344"
          test "$(sha256sum "$N17_DST" | awk '{print $1}')" = "bd31599978d927cbd3748dc77073503c78cf87ccc68b21458de08625ebbfa3a3"
          test "$(git hash-object "$N17_DST")" = "c5020af8fa61225f0e4a88104990c1663fddcec9"

          test "$(wc -c < "$N18_DST" | tr -d ' ')" = "2158626"
          test "$(sha256sum "$N18_DST" | awk '{print $1}')" = "18746fdde8a3b7699061fd6f4a8a6b666d50001250a2df902bb3b5995e7e2613"
          test "$(git hash-object "$N18_DST")" = "039471efd721fa5f822c4fb8ec933b4893f91641"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P0.3 S02-B N17 N18 canonical exact-blob publication"
          PUB_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main

          echo "publication_commit=$PUB_COMMIT" >> "$GITHUB_OUTPUT"
          echo "N17_EXACT_BLOB_PRESERVED=YES"
          echo "N18_EXACT_BLOB_PRESERVED=YES"
          echo "CANONICAL_PUBLICATION=PASS"

      - name: Story Shot Registration
        env:
          RUN_ID: ${{ github.run_id }}
          PUBLICATION_COMMIT: ${{ steps.publish.outputs.publication_commit }}
        shell: python
        run: |
          from pathlib import Path
          import json, os

          p = Path("production/story_shots/story_shot_index.jsonl")
          rows = [json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          existing = {x.get("shot_id") for x in rows}
          assert "N17" not in existing, "N17_ALREADY_REGISTERED"
          assert "N18" not in existing, "N18_ALREADY_REGISTERED"

          run_id = int(os.environ["RUN_ID"])
          pub = os.environ["PUBLICATION_COMMIT"]

          n17 = {
            "shot_id": "N17",
            "asset_class": "STORY_SHOT",
            "approval_status": "APPROVED",
            "lifecycle": "CURRENT",
            "historical_prefix": "N",
            "title": "Blood-Door Warning",
            "canonical_path": "production/image_library/approved/story_shots/N17_BLOOD_DOOR_WARNING_APPROVED_V001.png",
            "filename": "N17_BLOOD_DOOR_WARNING_APPROVED_V001.png",
            "byte_size": 1671344,
            "dimensions": {"width": 941, "height": 1672},
            "github_blob_sha": "c5020af8fa61225f0e4a88104990c1663fddcec9",
            "sha256_locked_identity": "bd31599978d927cbd3748dc77073503c78cf87ccc68b21458de08625ebbfa3a3",
            "sha256_verification_status": "VERIFIED_MATCH_BY_GITHUB_ACTIONS_2026-09-29",
            "binary_verification_run": run_id,
            "rename_preserved_exact_git_blob": True,
            "story_beat": "Ning Qiushui stops the sister discussion and gives Jun Luyuan restrained, practical Blood Door survival reminders; Jun listens and acknowledges.",
            "timeline": "01:28.120-01:40.700",
            "characters": ["NING_QIUSHUI", "JUN_LUYUAN"],
            "scene": "CASTLE_ENTRANCE",
            "continuity_tags": ["S02_B", "INTERIOR_THRESHOLD", "NING_QIUSHUI", "JUN_LUYUAN", "BLOOD_DOOR_WARNING", "SURVIVAL_RULES", "DAY_DOOR_OPEN"],
            "approved_at": "2026-09-29",
            "provenance": f"PO-approved N17 Candidate 03 exact source; exact-binary verification and canonical publication performed by GitHub Actions run {run_id}; publication commit {pub}; N17 Reference Delivery Bundle artifact 11018019993."
          }

          n18 = {
            "shot_id": "N18",
            "asset_class": "STORY_SHOT",
            "approval_status": "APPROVED",
            "lifecycle": "CURRENT",
            "historical_prefix": "N",
            "title": "Clear-Sky Doubt",
            "canonical_path": "production/image_library/approved/story_shots/N18_CLEAR_SKY_DOUBT_APPROVED_V001.png",
            "filename": "N18_CLEAR_SKY_DOUBT_APPROVED_V001.png",
            "byte_size": 2158626,
            "dimensions": {"width": 941, "height": 1672},
            "github_blob_sha": "039471efd721fa5f822c4fb8ec933b4893f91641",
            "sha256_locked_identity": "18746fdde8a3b7699061fd6f4a8a6b666d50001250a2df902bb3b5995e7e2613",
            "sha256_verification_status": "VERIFIED_MATCH_BY_GITHUB_ACTIONS_2026-09-29",
            "binary_verification_run": run_id,
            "rename_preserved_exact_git_blob": True,
            "story_beat": "Jun Luyuan looks toward the bright, still-open castle entrance and naturally questions the likelihood of rain because the weather visibly appears calm and clear.",
            "timeline": "01:40.700-01:46.720",
            "characters": ["JUN_LUYUAN"],
            "scene": "CASTLE_ENTRANCE",
            "continuity_tags": ["S02_B", "INTERIOR_THRESHOLD", "JUN_LUYUAN", "CLEAR_SKY_DOUBT", "DAY_DOOR_OPEN", "OPEN_DOOR", "BODY_PERFORMANCE_DIVERSITY"],
            "approved_at": "2026-09-29",
            "provenance": f"PO-approved N18 Candidate 04 Clean Regeneration exact source; exact-binary verification and canonical publication performed by GitHub Actions run {run_id}; publication commit {pub}; N18 Reference Delivery Bundle artifact 11025373622."
          }

          with p.open("a", encoding="utf-8") as f:
              f.write(json.dumps(n17, ensure_ascii=False, separators=(",", ":")) + "\n")
              f.write(json.dumps(n18, ensure_ascii=False, separators=(",", ":")) + "\n")

      - name: Commit Story Shot Registration
        id: regcommit
        shell: bash
        run: |
          set -euo pipefail
          git add production/story_shots/story_shot_index.jsonl
          git commit -m "P0.3 S02-B register N17 N18 Story Shots"
          REG_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "registration_commit=$REG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "STORY_SHOT_REGISTRATION=PASS"

      - name: Registration Verification
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          specs = {
            "N17": {
              "path": "production/image_library/approved/story_shots/N17_BLOOD_DOOR_WARNING_APPROVED_V001.png",
              "size": 1671344,
              "sha": "bd31599978d927cbd3748dc77073503c78cf87ccc68b21458de08625ebbfa3a3",
              "blob": "c5020af8fa61225f0e4a88104990c1663fddcec9",
              "title": "Blood-Door Warning",
              "timeline": "01:28.120-01:40.700",
              "characters": ["NING_QIUSHUI", "JUN_LUYUAN"],
            },
            "N18": {
              "path": "production/image_library/approved/story_shots/N18_CLEAR_SKY_DOUBT_APPROVED_V001.png",
              "size": 2158626,
              "sha": "18746fdde8a3b7699061fd6f4a8a6b666d50001250a2df902bb3b5995e7e2613",
              "blob": "039471efd721fa5f822c4fb8ec933b4893f91641",
              "title": "Clear-Sky Doubt",
              "timeline": "01:40.700-01:46.720",
              "characters": ["JUN_LUYUAN"],
            },
          }

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]

          for shot, s in specs.items():
              b = Path(s["path"]).read_bytes()
              assert len(b) == s["size"]
              assert hashlib.sha256(b).hexdigest() == s["sha"]
              assert subprocess.check_output(["git", "hash-object", s["path"]], text=True).strip() == s["blob"]
              assert struct.unpack(">II", b[16:24]) == (941, 1672)
              hits = [x for x in rows if x.get("shot_id") == shot]
              assert len(hits) == 1
              r = hits[0]
              assert r["canonical_path"] == s["path"]
              assert r["sha256_locked_identity"] == s["sha"]
              assert r["github_blob_sha"] == s["blob"]
              assert r["byte_size"] == s["size"]
              assert r["dimensions"] == {"width": 941, "height": 1672}
              assert r["approval_status"] == "APPROVED"
              assert r["lifecycle"] == "CURRENT"
              assert r["title"] == s["title"]
              assert r["scene"] == "CASTLE_ENTRANCE"
              assert r["characters"] == s["characters"]
              assert r["timeline"] == s["timeline"]
              print(f"{shot}_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")

          assert not Path("N17_Candidate_03_APPROVED.png").exists()
          assert not Path("城堡门外的晴天.png").exists()
          print("STAGING_CLEANUP_PASS")
          print("REGISTRATION_VERIFICATION=PASS")

      - name: Project Control Closeout
        env:
          RUN_ID: ${{ github.run_id }}
          PUBLICATION_COMMIT: ${{ steps.publish.outputs.publication_commit }}
          REGISTRATION_COMMIT: ${{ steps.regcommit.outputs.registration_commit }}
        shell: python
        run: |
          from pathlib import Path
          import json, os

          run_id = int(os.environ["RUN_ID"])
          pub = os.environ["PUBLICATION_COMMIT"]
          reg = os.environ["REGISTRATION_COMMIT"]
          gate = Path("docs/project_control/gates/P0_3_video_pipeline")

          n17 = f"""# S02-B｜N17 Story Shot Registration Closeout

Status: `COMPLETE / PRODUCT OWNER APPROVED / CANONICAL / REGISTERED / VERIFIED`

Date: 2026-09-29

- shot: `N17｜Blood-Door Warning`
- selected candidate: `N17 Candidate 03`
- canonical path: `production/image_library/approved/story_shots/N17_BLOOD_DOOR_WARNING_APPROVED_V001.png`
- dimensions: `941x1672`
- byte_size: `1671344`
- SHA-256: `bd31599978d927cbd3748dc77073503c78cf87ccc68b21458de08625ebbfa3a3`
- Git blob: `c5020af8fa61225f0e4a88104990c1663fddcec9`
- exact blob preserved: `YES`
- archival workflow run: `{run_id}`
- canonical publication commit: `{pub}`
- registration commit: `{reg}`
- registration verification: `PASS`
- Bundle: `N17_REFERENCE_DELIVERY_BUNDLE_V001`
- Bundle artifact: `11018019993`

`N17 = FORMALLY CLOSED`
"""
          (gate / "s02_b_n17_story_shot_registration_closeout_2026-09-29.md").write_text(n17, encoding="utf-8")

          n18 = f"""# S02-B｜N18 Story Shot Registration Closeout

Status: `COMPLETE / PRODUCT OWNER APPROVED / CANONICAL / REGISTERED / VERIFIED`

Date: 2026-09-29

- shot: `N18｜Clear-Sky Doubt`
- selected candidate: `N18 Candidate 04｜Clean Regeneration`
- canonical path: `production/image_library/approved/story_shots/N18_CLEAR_SKY_DOUBT_APPROVED_V001.png`
- dimensions: `941x1672`
- byte_size: `2158626`
- SHA-256: `18746fdde8a3b7699061fd6f4a8a6b666d50001250a2df902bb3b5995e7e2613`
- Git blob: `039471efd721fa5f822c4fb8ec933b4893f91641`
- exact blob preserved: `YES`
- archival workflow run: `{run_id}`
- canonical publication commit: `{pub}`
- registration commit: `{reg}`
- registration verification: `PASS`
- Bundle: `N18_REFERENCE_DELIVERY_BUNDLE_V001`
- Bundle artifact: `11025373622`

`N18 = FORMALLY CLOSED`

Next production step:

`N19 Scene Reference Design`
"""
          (gate / "s02_b_n18_story_shot_registration_closeout_2026-09-29.md").write_text(n18, encoding="utf-8")

          d = gate / "s02_b_deferred_archival_checkpoint_2026-09-29.md"
          d.write_text(
              d.read_text(encoding="utf-8")
              + f"\n\n## Evening closeout resolution\n\nN17 and N18 completed Exact Binary Verification → Canonical Publication → Story Shot Registration → Registration Verification in GitHub Actions run `{run_id}`. Deferred archival is resolved for these two shots.\n",
              encoding="utf-8"
          )

          ps_path = Path("docs/project_control/core/project_state.json")
          ps = json.loads(ps_path.read_text(encoding="utf-8"))
          ps["state_revision"] = "R133"
          ps["last_updated"] = "2026-09-29"
          ps["current_task"] = "P0.3｜S02-B｜N19 Scene Reference Design"
          ps["next_action"] = "Design and lock N19 Scene Reference Design V0.1 before any N19 Reference Delivery Bundle construction."
          ps["latest_checkpoint"] = {
            "id": "2026-09-29-N17-N18-ARCHIVAL-R133",
            "status": "N17 + N18 FORMALLY CLOSED / N19 READY FOR SCENE REFERENCE DESIGN",
            "completed": [
              "N17 Candidate 03 exact source verified, canonically published, registered, and registration-verified.",
              "N18 Candidate 04 Clean Regeneration exact source verified, canonically published, registered, and registration-verified.",
              "Exact Git blobs preserved with no re-encode or resize.",
              "Deferred archival checkpoint resolved for N17 and N18."
            ],
            "resume_from": "N19 Scene Reference Design V0.1.",
            "blockers": []
          }
          ps["n17_candidate_03"] = {
            "status": "PRODUCT OWNER APPROVED / CANONICAL PUBLISHED / FORMALLY REGISTERED / REGISTRATION VERIFIED / CLOSED",
            "selected_candidate": "N17 Candidate 03",
            "dimensions": "941x1672",
            "byte_size": 1671344,
            "sha256": "bd31599978d927cbd3748dc77073503c78cf87ccc68b21458de08625ebbfa3a3",
            "github_blob_sha": "c5020af8fa61225f0e4a88104990c1663fddcec9",
            "canonical_path": "production/image_library/approved/story_shots/N17_BLOOD_DOOR_WARNING_APPROVED_V001.png",
            "archival_workflow_run": run_id,
            "canonical_publication_commit": pub,
            "registration_commit": reg,
            "closeout_path": "docs/project_control/gates/P0_3_video_pipeline/s02_b_n17_story_shot_registration_closeout_2026-09-29.md"
          }
          ps["n18_candidate_04"] = {
            "status": "PRODUCT OWNER APPROVED / CANONICAL PUBLISHED / FORMALLY REGISTERED / REGISTRATION VERIFIED / CLOSED",
            "selected_candidate": "N18 Candidate 04｜Clean Regeneration",
            "dimensions": "941x1672",
            "byte_size": 2158626,
            "sha256": "18746fdde8a3b7699061fd6f4a8a6b666d50001250a2df902bb3b5995e7e2613",
            "github_blob_sha": "039471efd721fa5f822c4fb8ec933b4893f91641",
            "canonical_path": "production/image_library/approved/story_shots/N18_CLEAR_SKY_DOUBT_APPROVED_V001.png",
            "archival_workflow_run": run_id,
            "canonical_publication_commit": pub,
            "registration_commit": reg,
            "closeout_path": "docs/project_control/gates/P0_3_video_pipeline/s02_b_n18_story_shot_registration_closeout_2026-09-29.md"
          }
          ps_path.write_text(json.dumps(ps, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for logname, entry in [
            ("docs/project_control/logs/decision_log.md", f"\n- 2026-09-29｜S02-B｜N17/N18: Product Owner-approved exact binaries formally archived. N17/N18 are canonical, registered, and verified. Next: N19 Scene Reference Design. Archival run {run_id}.\n"),
            ("docs/project_control/logs/execution_log.md", f"\n- 2026-09-29｜P0.3 S02-B｜N17/N18 formal archival closeout: exact verification PASS; exact-blob publication commit {pub}; Story Shot registration commit {reg}; registration verification PASS; archival run {run_id}.\n")
          ]:
              lp = Path(logname)
              lp.write_text(lp.read_text(encoding="utf-8") + entry, encoding="utf-8")

      - name: Commit Project Control Closeout
        id: closecommit
        shell: bash
        run: |
          set -euo pipefail
          git add             docs/project_control/gates/P0_3_video_pipeline/s02_b_n17_story_shot_registration_closeout_2026-09-29.md             docs/project_control/gates/P0_3_video_pipeline/s02_b_n18_story_shot_registration_closeout_2026-09-29.md             docs/project_control/gates/P0_3_video_pipeline/s02_b_deferred_archival_checkpoint_2026-09-29.md             docs/project_control/core/project_state.json             docs/project_control/logs/decision_log.md             docs/project_control/logs/execution_log.md
          git commit -m "project-control: close N17 N18 formal archival"
          CLOSE_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "closeout_commit=$CLOSE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "PROJECT_CONTROL_CLOSEOUT=PASS"

      - name: Final Closeout Verification
        shell: python
        run: |
          from pathlib import Path
          import json

          ps = json.loads(Path("docs/project_control/core/project_state.json").read_text(encoding="utf-8"))
          assert ps["n17_candidate_03"]["status"].endswith("CLOSED")
          assert ps["n18_candidate_04"]["status"].endswith("CLOSED")
          assert ps["next_action"].startswith("Design and lock N19")
          assert Path("docs/project_control/gates/P0_3_video_pipeline/s02_b_n17_story_shot_registration_closeout_2026-09-29.md").exists()
          assert Path("docs/project_control/gates/P0_3_video_pipeline/s02_b_n18_story_shot_registration_closeout_2026-09-29.md").exists()
          print("N17_FORMAL_CLOSEOUT=PASS")
          print("N18_FORMAL_CLOSEOUT=PASS")
          print("PROJECT_CONTROL_CLOSEOUT=PASS")
          print("OVERALL_RESULT=PASS")
