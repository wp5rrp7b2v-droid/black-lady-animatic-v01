name: N21 Threshold Environment Reference V001 Verify

on:
  push:
    branches: [main]
    paths:
      - "production/publication_requests/N21_THRESHOLD_TRANSITION_ENVIRONMENT_REFERENCE_V001.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact binary verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct, subprocess, json

          p = Path("production/environment_references/n21_threshold_transition/N21_THRESHOLD_TRANSITION_ENVIRONMENT_REFERENCE_V001.png")
          m = Path("production/environment_references/n21_threshold_transition/N21_THRESHOLD_TRANSITION_ENVIRONMENT_REFERENCE_V001.manifest.json")

          expected_sha = "dd1b2dc6b831b2e22d8dc249859af1b4f65da6a20437cd8821627144e89a4f13"
          expected_blob = "358057948ec222bbe63a47a07022de4453e20fc8"
          expected_bytes = 3394494
          expected_wh = (941, 1672)
          expected_mode = "RGBA"

          if not p.is_file():
              raise SystemExit("FAIL: canonical PNG missing")
          data = p.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("FAIL: invalid PNG signature")

          actual_sha = hashlib.sha256(data).hexdigest()
          actual_blob = subprocess.check_output(["git","hash-object",str(p)], text=True).strip()
          wh = struct.unpack(">II", data[16:24])
          color_type = data[25]
          mode_map = {0:"L",2:"RGB",3:"P",4:"LA",6:"RGBA"}
          mode = mode_map.get(color_type, f"PNG_COLOR_TYPE_{color_type}")

          manifest = json.loads(m.read_text(encoding="utf-8"))
          checks = {
              "bytes": len(data) == expected_bytes,
              "sha256": actual_sha == expected_sha,
              "git_blob": actual_blob == expected_blob,
              "dimensions": wh == expected_wh,
              "mode": mode == expected_mode,
              "manifest_sha": manifest["output"]["sha256"] == expected_sha,
              "manifest_blob": manifest["output"]["git_blob"] == expected_blob,
              "manifest_bytes": manifest["output"]["byte_size"] == expected_bytes,
              "manifest_dimensions": (manifest["output"]["width"],manifest["output"]["height"]) == expected_wh,
              "manifest_mode": manifest["output"]["mode"] == expected_mode,
          }
          for k,v in checks.items():
              print(f"{k}={'PASS' if v else 'FAIL'}")
          print("actual_sha256="+actual_sha)
          print("actual_git_blob="+actual_blob)
          print("actual_bytes="+str(len(data)))
          print(f"actual_dimensions={wh[0]}x{wh[1]}")
          print("actual_mode="+mode)
          if not all(checks.values()):
              raise SystemExit("OVERALL_RESULT=FAIL")
          print("EXACT_BINARY_MATCH=YES")
          print("OVERALL_RESULT=PASS")
          PY
