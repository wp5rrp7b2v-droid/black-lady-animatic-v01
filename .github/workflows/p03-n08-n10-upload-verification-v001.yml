name: P03 N08-N10 Upload Verification V001

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n08-n10-upload-verification-v001.yml"

permissions:
  contents: read

jobs:
  verify-uploads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify uploaded PNGs and stage exact binaries
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, struct

          root = pathlib.Path.cwd().resolve()
          srcdir = root / "production/image_library/approved/story_shots"
          out = root / "N08_N10_UPLOAD_VERIFICATION_V001"
          out.mkdir()

          names = [
              "39b24dd5-3959-47f9-af27-98d782b7a5ed.png",
              "c01710f7-2b7b-44b6-814b-8f93401b30a3.png",
              "e44b1fa8-ad0d-4838-92c5-0021ef2ebfb6.png",
          ]

          rows = []
          for name in names:
              p = srcdir / name
              if not p.is_file() or p.is_symlink():
                  raise SystemExit(f"Missing or redirected upload: {name}")
              data = p.read_bytes()
              if len(data) < 24 or data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"Invalid PNG: {name}")
              w, h = struct.unpack(">II", data[16:24])
              sha256 = hashlib.sha256(data).hexdigest()
              git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if (w,h) != (941,1672):
                  raise SystemExit(f"Unexpected dimensions for {name}: {w}x{h}")
              if git_blob != os.popen(f"git hash-object '{p}'").read().strip():
                  raise SystemExit(f"Git blob mismatch: {name}")
              shutil.copyfile(p, out / name)
              rows.append({
                  "filename": name,
                  "byte_size": len(data),
                  "sha256": sha256,
                  "git_blob_sha": git_blob,
                  "width": w,
                  "height": h,
                  "source_commit": os.environ["SOURCE_COMMIT"],
              })

          (out / "upload_manifest.json").write_text(
              json.dumps({"source_commit":os.environ["SOURCE_COMMIT"],"count":3,"files":rows,"overall_result":"PASS"},indent=2)+"\n",
              encoding="utf-8"
          )
          print(json.dumps(rows, indent=2))
          print("PASS: 3/3 uploaded PNG binaries staged exactly")
          PY

      - name: Upload verification artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: N08_N10_UPLOAD_VERIFICATION_V001
          path: N08_N10_UPLOAD_VERIFICATION_V001/
          retention-days: 7
          if-no-files-found: error
