name: One-Time Drive Safe Archive Export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-drive-safe-archive-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify retired archive baseline
        shell: bash
        run: |
          set -euo pipefail
          TARGET="docs/project_control/archive/repository_cleanup_2026-10-07/original"
          test -d "$TARGET"
          COUNT="$(find "$TARGET" -type f | wc -l | tr -d ' ')"
          BYTES="$(find "$TARGET" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
          echo "FILE_COUNT=$COUNT"
          echo "TOTAL_BYTES=$BYTES"
          test "$COUNT" -eq 116
          test "$BYTES" -eq 5488370

      - name: Build exact archive and manifests
        shell: bash
        run: |
          set -euo pipefail
          TARGET="docs/project_control/archive/repository_cleanup_2026-10-07/original"
          OUT="REPOSITORY_CLEANUP_2026-10-07_ORIGINAL_ARCHIVE"
          mkdir -p "$OUT"
          (
            cd "$TARGET"
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/SHA256SUMS.txt"
          git ls-tree -r HEAD "$TARGET" > "$OUT/GIT_BLOBS.txt"
          printf 'source_commit=%s\nfile_count=116\ntotal_bytes=5488370\n' "$GITHUB_SHA" > "$OUT/EXPORT_RECEIPT.txt"
          zip -q -r "$OUT/repository_cleanup_2026-10-07_original.zip" "$TARGET"
          sha256sum "$OUT/repository_cleanup_2026-10-07_original.zip" > "$OUT/ARCHIVE_SHA256.txt"

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: REPOSITORY_CLEANUP_2026-10-07_ORIGINAL_ARCHIVE
          path: REPOSITORY_CLEANUP_2026-10-07_ORIGINAL_ARCHIVE/
          retention-days: 7
          if-no-files-found: error
