name: N21 Redesign Visual Inspection V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/n21-redesign-visual-inspection-v001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect exact canonical visual evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/N21_REDESIGN_VISUAL_INSPECTION_V001"
          mkdir -p "$OUT"

          cp "production/image_library/approved/story_shots/N20_DO_NOT_TOUCH_THINGS_APPROVED_V001.png" "$OUT/01_N20.png"
          cp "production/image_library/approved/story_shots/N22_PEOPLE_IN_THE_FLOW_APPROVED_V001.png" "$OUT/02_N22.png"
          cp "production/image_library/approved/story_shots/N23_NEIL_AT_OPEN_DOOR_APPROVED_V001.png" "$OUT/03_N23.png"
          cp "production/image_library/scene_masters/castle_entrance/SCENE_CASTLE_ENTRANCE_SCENE_MASTER_DEFAULT_DAY_DOOR_OPEN_V001.png" "$OUT/04_SCENE_MASTER.png"
          cp "production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.png" "$OUT/05_DOOR_CONTROL.png"
          cp "production/human_references/generic_guest_crowd_core_set_v001/BLACK_LADY_GENERIC_GUEST_CROWD_CORE_SET_V001_FRONT.png" "$OUT/06_GUEST_FRONT.png"
          cp "production/human_references/generic_guest_crowd_core_set_v001/BLACK_LADY_GENERIC_GUEST_CROWD_CORE_SET_V001_LEFT_PROFILE.png" "$OUT/07_GUEST_LEFT_PROFILE.png"
          cp "production/human_references/generic_guest_crowd_core_set_v001/BLACK_LADY_GENERIC_GUEST_CROWD_CORE_SET_V001_REAR_3Q.png" "$OUT/08_GUEST_REAR_3Q.png"
          cp "production/human_references/generic_guest_crowd_core_set_v001/BLACK_LADY_GENERIC_GUEST_CROWD_CORE_SET_V001_BACK.png" "$OUT/09_GUEST_BACK.png"

          cd "$OUT"
          sha256sum *.png > SHA256SUMS.txt
          wc -c *.png > BYTE_SIZES.txt

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: N21_REDESIGN_VISUAL_INSPECTION_V001
          path: ${{ runner.temp }}/N21_REDESIGN_VISUAL_INSPECTION_V001/
          retention-days: 7
          if-no-files-found: error
