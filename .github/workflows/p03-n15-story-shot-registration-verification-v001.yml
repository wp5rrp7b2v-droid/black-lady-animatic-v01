name: N15 Story Shot Registration Verification V001
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p03-n15-story-shot-registration-verification-v001.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify N15 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct
          path="production/image_library/approved/story_shots/N15_LOCKED_GATE_FORESHADOWING_APPROVED_V001.png"
          sha="2712321ca6348cc39234f8ae65bcdb0fd2e6b2faf0b56dcc94a51235011d1191"
          blob="4d9ca2dcd33df32294ff9b928bf3ab88d63c7487"
          b=Path(path).read_bytes()
          assert len(b)==2583010
          assert hashlib.sha256(b).hexdigest()==sha
          assert subprocess.check_output(["git","hash-object",path],text=True).strip()==blob
          assert struct.unpack(">II",b[16:24])==(941,1672)
          rows=[json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text().splitlines() if x.strip()]
          hits=[x for x in rows if x.get("shot_id")=="N15"]
          assert len(hits)==1
          r=hits[0]
          assert r["canonical_path"]==path
          assert r["sha256_locked_identity"]==sha
          assert r["github_blob_sha"]==blob
          assert r["byte_size"]==2583010
          assert r["dimensions"]=={"width":941,"height":1672}
          assert r["approval_status"]=="APPROVED" and r["lifecycle"]=="CURRENT"
          assert not Path("N15_Candidate_01_APPROVED.png").exists()
          print("N15_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
