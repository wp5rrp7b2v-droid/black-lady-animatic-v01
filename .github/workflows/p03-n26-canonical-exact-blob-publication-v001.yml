name: N26 Canonical Exact-Blob Publication V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n26-canonical-exact-blob-publication-v001.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and publish exact blob
        shell: bash
        run: |
          set -euo pipefail

          SRC="staging/story_shot_candidates/N26/N26_Candidate_03_APPROVED.png"
          DST="production/image_library/approved/story_shots/N26_LADYS_RULE_AND_FORWARD_MOTION_APPROVED_V001.png"

          EXPECT_SIZE="2504586"
          EXPECT_SHA="8dcd5f5449ad6429f45e7b4f59ce15bfd574eeb8aa45a83d4e4132df3cf436d9"
          EXPECT_BLOB="a5ce429689a99437773385e25b9813745e380f74"

          test -f "$SRC"
          test ! -e "$DST"

          test "$(wc -c < "$SRC" | tr -d ' ')" = "$EXPECT_SIZE"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$SRC")" = "$EXPECT_BLOB"

          mkdir -p "$(dirname "$DST")"
          git mv "$SRC" "$DST"

          test "$(wc -c < "$DST" | tr -d ' ')" = "$EXPECT_SIZE"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$DST")" = "$EXPECT_BLOB"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "P0.3 N26 canonical exact-blob publication"
          git push origin HEAD:main

          echo "SOURCE_SIZE=$EXPECT_SIZE"
          echo "SOURCE_SHA256=$EXPECT_SHA"
          echo "SOURCE_GIT_BLOB=$EXPECT_BLOB"
          echo "CANONICAL_PATH=$DST"
          echo "EXACT_BLOB_PRESERVED=YES"
          echo "OVERALL_RESULT=PASS"
