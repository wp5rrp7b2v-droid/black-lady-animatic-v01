name: N25 Story Shot Registration Verification V001

on:
  push:
    branches: [main]
    paths:
      - "production/story_shots/story_shot_index.jsonl"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N25 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          path = "production/image_library/approved/story_shots/N25_RAIN_DAY_RULE_NEIL_ANSWERS_WITHOUT_TURNING_APPROVED_V001.png"
          sha = "b855040e30e014275920a1aaebf24c1ea4abb0623708f9901e47214b4dc27733"
          blob = "8e523285a832496f1e316fd20737293668cf18db"
          expected_size = 2749858

          b = Path(path).read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert len(b) == expected_size
          assert hashlib.sha256(b).hexdigest() == sha
          assert subprocess.check_output(["git","hash-object",path], text=True).strip() == blob
          assert struct.unpack(">II", b[16:24]) == (941,1672)

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          hits = [x for x in rows if x.get("shot_id") == "N25"]
          assert len(hits) == 1

          r = hits[0]
          assert r["canonical_path"] == path
          assert r["filename"] == "N25_RAIN_DAY_RULE_NEIL_ANSWERS_WITHOUT_TURNING_APPROVED_V001.png"
          assert r["sha256_locked_identity"] == sha
          assert r["github_blob_sha"] == blob
          assert r["byte_size"] == expected_size
          assert r["dimensions"] == {"width":941,"height":1672}
          assert r["approval_status"] == "APPROVED"
          assert r["lifecycle"] == "CURRENT"
          assert r["asset_class"] == "STORY_SHOT"
          assert r["title"] == "Rain-Day Rule — Neil Answers Without Turning"
          assert r["scene"] == "CASTLE_ENTRANCE_INNER_LOBBY"
          assert r["characters"] == ["NEIL"]
          assert r["timeline"] == "02:15.500-02:19.500"
          assert r["rename_preserved_exact_git_blob"] is True

          assert not Path("staging/story_shot_candidates/N24/N25_Candidate_03_APPROVED.png").exists()

          print("N25_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
