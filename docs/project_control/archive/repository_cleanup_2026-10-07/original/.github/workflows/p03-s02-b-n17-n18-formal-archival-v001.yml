name: S02-B N17 N18 Formal Archival Closeout V001

on:
  push:
    branches: [main]
    paths:
      - "docs/project_control/triggers/n17_n18_formal_archival.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s02-b-n17-n18-formal-archival-v001
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run exact-binary archival pipeline
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/archive_s02_b_n17_n18_v001.py
