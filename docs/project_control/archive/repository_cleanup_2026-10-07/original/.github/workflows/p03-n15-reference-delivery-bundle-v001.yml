name: N15 Reference Delivery Bundle V001

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-delivery-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify canonical references and build bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/build_n15_reference_delivery_bundle_v001.py

      - name: Upload verified bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: N15_REFERENCE_DELIVERY_BUNDLE_V001
          path: N15_REFERENCE_DELIVERY_BUNDLE_V001/
          if-no-files-found: error
          retention-days: 7
