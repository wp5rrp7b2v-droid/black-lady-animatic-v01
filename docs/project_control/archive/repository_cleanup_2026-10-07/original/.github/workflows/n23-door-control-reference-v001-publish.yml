name: N23 Door Control Reference V001 Canonical Publication

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/project_control/gates/P0_3_video_pipeline/n23_castle_entrance_door_control_reference_v001_visual_approval_2026-10-03.md"
      - ".github/workflows/n23-door-control-reference-v001-publish.yml"

permissions:
  contents: write

jobs:
  publish-exact-binary:
    runs-on: ubuntu-latest
    env:
      CROP_PLAN: production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.crop_plan.json
      OUTPUT: production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.png
      MANIFEST: production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.manifest.json
      EXPECTED_SHA256: "5718ce8c68069ca41143d666406a8c4cec3c285837a861337da758769bbfb652"
      EXPECTED_BYTES: "546543"
      PILLOW_VERSION: "11.3.0"

    steps:
      - name: Checkout approval commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow==${PILLOW_VERSION}"

      - name: Rebuild exact approved binary
        run: |
          mkdir -p "$(dirname "${OUTPUT}")"
          python scripts/build_n23_castle_entrance_door_control_reference_v001.py \
            --crop-plan "${CROP_PLAN}" \
            --output "${OUTPUT}" \
            --report /tmp/n23_door_build_report.json

      - name: Verify exact approved binary
        run: |
          ACTUAL_SHA="$(sha256sum "${OUTPUT}" | awk '{print $1}')"
          ACTUAL_BYTES="$(wc -c < "${OUTPUT}" | tr -d ' ')"
          echo "ACTUAL_SHA256=${ACTUAL_SHA}"
          echo "ACTUAL_BYTES=${ACTUAL_BYTES}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA256}"
          test "${ACTUAL_BYTES}" = "${EXPECTED_BYTES}"
          python - <<'PY'
          from PIL import Image
          p="production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.png"
          with Image.open(p) as im:
              assert im.size == (315,1265), im.size
              assert im.mode == "RGB", im.mode
          print("EXACT_BINARY_VERIFICATION=PASS")
          PY

      - name: Write canonical manifest
        run: |
          python - <<'PY'
          import hashlib, json, platform
          from pathlib import Path
          import PIL
          out=Path("production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.png")
          manifest={
            "schema_version":"1.0",
            "reference_id":"N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001",
            "status":"PRODUCT_OWNER_APPROVED_CANONICAL",
            "source_asset_id":"AST_IMG_000052",
            "source_sha256":"d49af6a5e42d0867f2ffe4883e6af82f4d3777da3e96d788924cee2a9c743961",
            "crop_box_ltrb":[615,75,930,1340],
            "width":315,
            "height":1265,
            "mode":"RGB",
            "byte_size":out.stat().st_size,
            "sha256":hashlib.sha256(out.read_bytes()).hexdigest(),
            "python_version":platform.python_version(),
            "pillow_version":PIL.__version__,
            "determinism_proof_run":37106490989,
            "determinism_proof_artifact_id":11267754516,
            "product_owner_visual_approval_date":"2026-10-03",
            "camera_composition_inheritance":"FORBIDDEN",
            "semantic_scope":"DOOR IDENTITY / RIGHT DOOR LEAF / MATERIAL / OPEN STATE / LOCAL NEIL-SIDE RELATION ONLY",
            "bundle_v003_authorized":False,
            "candidate_03_generation_authorized":False
          }
          Path("production/controlled_references/n23/N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001.manifest.json").write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Commit canonical controlled reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OUTPUT}" "${MANIFEST}"
          git diff --cached --exit-code && { echo "Nothing to publish"; exit 1; } || true
          git commit -m "n23: publish approved Door Control reference V001"
          git push origin HEAD:main

      - name: Publication summary
        run: |
          echo "CANONICAL_PUBLICATION=PASS"
          echo "REFERENCE=N23_CASTLE_ENTRANCE_DOOR_CONTROL_REFERENCE_V001"
          echo "SHA256=${EXPECTED_SHA256}"
          echo "BYTES=${EXPECTED_BYTES}"
