name: N16 Canonical Exact-Blob Publication V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n16-canonical-exact-blob-publication-v001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and publish exact blob
        shell: bash
        run: |
          set -euo pipefail

          SRC="古堡门内的低声交谈.png"
          DST="production/image_library/approved/story_shots/N16_SISTER_QUESTION_APPROVED_V001.png"

          EXPECT_SIZE="1942422"
          EXPECT_SHA="b26fb7d64a60fbd28d39b0ae22f7c85df18d4f947f31a3591c847dd5e1acf406"
          EXPECT_BLOB="44971dd53e37cd1b582bcf5094b0f09cb8e0647d"

          test -f "$SRC"
          test ! -e "$DST"

          test "$(wc -c < "$SRC" | tr -d ' ')" = "$EXPECT_SIZE"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$SRC")" = "$EXPECT_BLOB"

          mkdir -p "$(dirname "$DST")"
          git mv "$SRC" "$DST"

          test "$(wc -c < "$DST" | tr -d ' ')" = "$EXPECT_SIZE"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$DST")" = "$EXPECT_BLOB"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "P0.3 N16 canonical exact-blob publication"
          git push origin HEAD:main

          echo "SOURCE_SIZE=$EXPECT_SIZE"
          echo "SOURCE_SHA256=$EXPECT_SHA"
          echo "SOURCE_GIT_BLOB=$EXPECT_BLOB"
          echo "CANONICAL_PATH=$DST"
          echo "EXACT_BLOB_PRESERVED=YES"
          echo "OVERALL_RESULT=PASS"
