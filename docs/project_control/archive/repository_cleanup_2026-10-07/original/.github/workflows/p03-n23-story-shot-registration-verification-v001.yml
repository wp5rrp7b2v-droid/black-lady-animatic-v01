name: N23 Story Shot Registration Verification V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n23-story-shot-registration-verification-v001.yml"
      - "production/story_shots/story_shot_index.jsonl"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify N23 canonical binary and index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, struct

          path = "production/image_library/approved/story_shots/N23_NEIL_AT_OPEN_DOOR_APPROVED_V001.png"
          sha = "2d94488e36d878ccb6ae7c3f9f3bf2a122eebca5ae01ad0e5b3105de4d535973"
          blob = "649ed97addf97f126a05e12d43325720a624ea19"
          expected_size = 2697400

          b = Path(path).read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert len(b) == expected_size
          assert hashlib.sha256(b).hexdigest() == sha
          assert subprocess.check_output(["git","hash-object",path], text=True).strip() == blob
          assert struct.unpack(">II", b[16:24]) == (941,1672)

          rows = [json.loads(x) for x in Path("production/story_shots/story_shot_index.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          hits = [x for x in rows if x.get("shot_id") == "N23"]
          assert len(hits) == 1

          r = hits[0]
          assert r["canonical_path"] == path
          assert r["filename"] == "N23_NEIL_AT_OPEN_DOOR_APPROVED_V001.png"
          assert r["sha256_locked_identity"] == sha
          assert r["github_blob_sha"] == blob
          assert r["byte_size"] == expected_size
          assert r["dimensions"] == {"width":941,"height":1672}
          assert r["approval_status"] == "APPROVED"
          assert r["lifecycle"] == "CURRENT"
          assert r["asset_class"] == "STORY_SHOT"
          assert r["title"] == "Neil at the Open Door — Watches the Group Enter"
          assert r["scene"] == "CASTLE_ENTRANCE"
          assert r["characters"] == ["NEIL","GUANG_YONG"]
          assert r["timeline"] == "after N22 / exact N23 micro-cut deferred"
          assert r["rename_preserved_exact_git_blob"] is True

          assert not Path("staging/story_shot_candidates/N23/N23_Candidate_03_APPROVED.png").exists()

          print("N23_PASS SHA_MATCH=YES BLOB_MATCH=YES INDEX_MATCH=YES DIMENSIONS_MATCH=YES")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
