name: S02-B Audio Only QC Proof V001
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/p03-s02-b-audio-only-qc-proof-v001.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build exact PCM QC proof
        run: |
          mkdir -p S02_B_AUDIO_ONLY_QC_PROOF_V001
          SRC="staging/p0_3_a01_a02_transition_validation/AUDIO_MVP1_CANONICAL_V001.m4a"

          test -f "$SRC"
          test "$(stat -c%s "$SRC")" = "4957338"
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = "8d0d12d3af5e2c15032912605c0d1b3f3e892fe24918a7064864b136987737a0"

          ffmpeg -hide_banner -loglevel error -i "$SRC"             -af "atrim=start=78.750:end=143.000,asetpts=PTS-STARTPTS"             -c:a pcm_s16le -ar 44100 -ac 2             S02_B_AUDIO_ONLY_QC_PROOF_V001/S02_B_AUDIO_ONLY_QC_PROOF_V001.wav

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 S02_B_AUDIO_ONLY_QC_PROOF_V001/S02_B_AUDIO_ONLY_QC_PROOF_V001.wav)"
          printf '%s\n' "$DURATION" | tee S02_B_AUDIO_ONLY_QC_PROOF_V001/duration.txt

          python -c 'import subprocess; d=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1","S02_B_AUDIO_ONLY_QC_PROOF_V001/S02_B_AUDIO_ONLY_QC_PROOF_V001.wav"], text=True).strip()); assert abs(d-64.250) <= 0.002, d; print("DURATION_MATCH=YES")'

          sha256sum S02_B_AUDIO_ONLY_QC_PROOF_V001/S02_B_AUDIO_ONLY_QC_PROOF_V001.wav             | tee S02_B_AUDIO_ONLY_QC_PROOF_V001/sha256.txt

          ffmpeg -v error -i S02_B_AUDIO_ONLY_QC_PROOF_V001/S02_B_AUDIO_ONLY_QC_PROOF_V001.wav -f null -

          {
            echo "SOURCE_SHA_MATCH=YES"
            echo "SOURCE_BYTE_SIZE_MATCH=YES"
            echo "BOUNDARY=00:01:18.750-->00:02:23.000"
            echo "TARGET_DURATION=64.250"
            echo "DURATION_MATCH=YES"
            echo "FULL_DECODE=PASS"
            echo "NEXT_SPEECH_ALIGNMENT_START=00:02:23.420"
            echo "LAST_TARGET_WORD_ALIGNMENT_END=00:02:22.560"
          } | tee S02_B_AUDIO_ONLY_QC_PROOF_V001/qc.txt

      - uses: actions/upload-artifact@v4
        with:
          name: S02_B_AUDIO_ONLY_QC_PROOF_V001
          path: S02_B_AUDIO_ONLY_QC_PROOF_V001/
          retention-days: 7
          if-no-files-found: error
