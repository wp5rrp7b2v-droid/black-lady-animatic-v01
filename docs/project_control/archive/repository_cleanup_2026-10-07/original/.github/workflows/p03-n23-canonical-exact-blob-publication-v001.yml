name: N23 Canonical Exact-Blob Publication V001

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p03-n23-canonical-exact-blob-publication-v001.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and publish exact blob
        shell: bash
        run: |
          set -euo pipefail

          SRC="staging/story_shot_candidates/N23/N23_Candidate_03_APPROVED.png"
          DST="production/image_library/approved/story_shots/N23_NEIL_AT_OPEN_DOOR_APPROVED_V001.png"

          EXPECT_SIZE="2697400"
          EXPECT_SHA="2d94488e36d878ccb6ae7c3f9f3bf2a122eebca5ae01ad0e5b3105de4d535973"
          EXPECT_BLOB="649ed97addf97f126a05e12d43325720a624ea19"

          test -f "$SRC"
          test ! -e "$DST"

          test "$(wc -c < "$SRC" | tr -d ' ')" = "$EXPECT_SIZE"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$SRC")" = "$EXPECT_BLOB"

          mkdir -p "$(dirname "$DST")"
          git mv "$SRC" "$DST"

          test "$(wc -c < "$DST" | tr -d ' ')" = "$EXPECT_SIZE"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$DST")" = "$EXPECT_BLOB"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "P0.3 N23 canonical exact-blob publication"
          git push origin HEAD:main

          echo "SOURCE_SIZE=$EXPECT_SIZE"
          echo "SOURCE_SHA256=$EXPECT_SHA"
          echo "SOURCE_GIT_BLOB=$EXPECT_BLOB"
          echo "CANONICAL_PATH=$DST"
          echo "EXACT_BLOB_PRESERVED=YES"
          echo "OVERALL_RESULT=PASS"
