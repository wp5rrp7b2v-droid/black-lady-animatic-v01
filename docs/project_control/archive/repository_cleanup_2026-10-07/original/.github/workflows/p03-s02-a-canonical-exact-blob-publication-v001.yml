name: S02-A Canonical Exact-Blob Publication V001
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p03-s02-a-canonical-exact-blob-publication-v001.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and publish exact blob
        shell: bash
        run: |
          set -euo pipefail
          SRC="S02_A_ASSEMBLY_PROOF_V002_COMPAT.mp4"
          DST="production/video/approved/s02_a/S02_A_ASSEMBLY_APPROVED_V001.mp4"
          EXPECT_SHA="937008e11d20892ea0a17be64719a19cb131d174871930bc29004a678bb58ed1"
          EXPECT_BLOB="bcd3fef7a8d600c95cb4d7242d411cc0df41859c"
          EXPECT_BYTES="6822004"

          test -f "$SRC"
          test ! -e "$DST"
          test "$(stat -c%s "$SRC")" = "$EXPECT_BYTES"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$SRC")" = "$EXPECT_BLOB"

          mkdir -p "$(dirname "$DST")"
          git mv "$SRC" "$DST"

          test "$(stat -c%s "$DST")" = "$EXPECT_BYTES"
          test "$(sha256sum "$DST" | awk '{print $1}')" = "$EXPECT_SHA"
          test "$(git hash-object "$DST")" = "$EXPECT_BLOB"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P0.3 S02-A canonical exact-blob publication"
          git push origin HEAD:main

          echo "CANONICAL_VIDEO_ID=S02_A_ASSEMBLY_V001"
          echo "SOURCE_SHA256=$EXPECT_SHA"
          echo "SOURCE_GIT_BLOB=$EXPECT_BLOB"
          echo "BYTE_SIZE=$EXPECT_BYTES"
          echo "CANONICAL_PATH=$DST"
          echo "EXACT_BLOB_PRESERVED=YES"
          echo "OVERALL_RESULT=PASS"
