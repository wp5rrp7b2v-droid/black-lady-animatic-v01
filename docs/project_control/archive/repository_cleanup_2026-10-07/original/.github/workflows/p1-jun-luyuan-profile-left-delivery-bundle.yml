name: P1 Jun Luyuan PROFILE_LEFT Delivery Bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p1-jun-luyuan-profile-left-delivery-bundle.yml"

permissions:
  contents: read

jobs:
  build-delivery-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact canonical references and build bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib, pathlib, shutil

          registry_path = pathlib.Path("production/asset_registry/asset_registry.jsonl")
          expected = {
              "AST_IMG_000017": {
                  "role": "FACE_FRONT",
                  "sha256": "7bf1f211743fb9f071d427c1404ea04dfd71c3804b5b526c2dca8b258ed4b96f",
                  "bytes": 2859111,
                  "path": "production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_FACE_FRONT_DEFAULT_DEFAULT_V001.png",
              },
              "AST_IMG_000018": {
                  "role": "PROFILE_RIGHT",
                  "sha256": "7a04169daed3034ed9d37a508670dce995d2dc2cb75a11148006f9e821321c92",
                  "bytes": 2769878,
                  "path": "production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_PROFILE_RIGHT_DEFAULT_DEFAULT_V001.png",
              },
              "AST_IMG_000016": {
                  "role": "FACE_3Q_RIGHT",
                  "sha256": "f9ddbb18d4b548bf4887d09d1e0a9eba8be2dde7d61275a8c09a1a5d639f9929",
                  "bytes": 2874516,
                  "path": "production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_FACE_3Q_RIGHT_DEFAULT_DEFAULT_V001.png",
              },
              "AST_IMG_000015": {
                  "role": "BODY_FRONT",
                  "sha256": "f9960466266f08d79fde32435f542bd47ed0f8ab26af99bbb2928bd8d3957e92",
                  "bytes": 2840979,
                  "path": "production/image_library/character_references/jun_luyuan/CHAR_JUN_LUYUAN_BODY_FRONT_DEFAULT_DEFAULT_V001.png",
              },
          }

          rows = {}
          for line in registry_path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              aid = row.get("asset_id")
              if aid in expected:
                  rows[aid] = row

          if set(rows) != set(expected):
              raise SystemExit(f"Registry asset set mismatch: got={sorted(rows)} expected={sorted(expected)}")

          out = pathlib.Path("P1_JUN_LUYUAN_PROFILE_LEFT_DELIVERY_BUNDLE_V001")
          refs = out / "visual_refs"
          refs.mkdir(parents=True, exist_ok=True)
          manifest = {
              "bundle_id": "P1_JUN_LUYUAN_PROFILE_LEFT_DELIVERY_BUNDLE_V001",
              "target": "CHAR_JUN_LUYUAN_PROFILE_LEFT_DEFAULT_DEFAULT_V001.png",
              "entity_id": "CHAR_JUN_LUYUAN",
              "target_role": "PROFILE_LEFT",
              "source_commit": None,
              "references": [],
          }

          for aid, exp in expected.items():
              row = rows[aid]
              checks = {
                  "entity_id": row.get("entity_id") == "CHAR_JUN_LUYUAN",
                  "role": row.get("role") == exp["role"],
                  "approval_status": row.get("approval_status") == "APPROVED",
                  "lifecycle": row.get("lifecycle") == "CURRENT",
                  "variant": row.get("variant") == "DEFAULT",
                  "state": row.get("state") == "DEFAULT",
                  "resolver_usage": row.get("resolver_usage") == "DEFAULT",
                  "registry_sha": row.get("sha256") == exp["sha256"],
                  "registry_bytes": row.get("byte_size") == exp["bytes"],
                  "storage_uri": row.get("storage_uri") == exp["path"],
              }
              if not all(checks.values()):
                  raise SystemExit(f"{aid} registry validation failed: {checks}")

              src = pathlib.Path(exp["path"])
              data = src.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest != exp["sha256"] or len(data) != exp["bytes"]:
                  raise SystemExit(f"{aid} canonical byte validation failed")

              dst = refs / f"{aid}__{src.name}"
              shutil.copyfile(src, dst)
              copied = dst.read_bytes()
              if hashlib.sha256(copied).hexdigest() != exp["sha256"] or len(copied) != exp["bytes"]:
                  raise SystemExit(f"{aid} copied byte validation failed")

              manifest["references"].append({
                  "asset_id": aid,
                  "role": exp["role"],
                  "version": f"V{int(row.get('version_no', 1)):03d}",
                  "sha256": exp["sha256"],
                  "byte_size": exp["bytes"],
                  "canonical_path": exp["path"],
                  "bundle_path": str(dst),
              })

          pathlib.Path(out / "delivery_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          pathlib.Path(out / "WORK_HANDOFF.md").write_text(
              "# P1 Jun Luyuan PROFILE_LEFT Delivery Bundle\n\n"
              "Transport-only bundle. Not a formal Asset.\n"
              "Verify all four files against delivery_manifest.json before image generation.\n"
              "Use the four exact references for CHAR_JUN_LUYUAN PROFILE_LEFT candidate generation.\n"
              "Do not modify Registry or Project Control and do not allocate D-070.\n",
              encoding="utf-8",
          )

          # Final pre-upload revalidation.
          for ref in manifest["references"]:
              p = pathlib.Path(ref["bundle_path"])
              b = p.read_bytes()
              if hashlib.sha256(b).hexdigest() != ref["sha256"] or len(b) != ref["byte_size"]:
                  raise SystemExit(f"Final validation failed: {ref['asset_id']}")
          print("PASS: 4/4 exact canonical reference binaries verified")
          PY

      - name: Record source commit in manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("P1_JUN_LUYUAN_PROFILE_LEFT_DELIVERY_BUNDLE_V001/delivery_manifest.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["source_commit"] = os.environ["SOURCE_SHA"]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: P1_JUN_LUYUAN_PROFILE_LEFT_DELIVERY_BUNDLE_V001
          path: P1_JUN_LUYUAN_PROFILE_LEFT_DELIVERY_BUNDLE_V001/
          retention-days: 7
          if-no-files-found: error
