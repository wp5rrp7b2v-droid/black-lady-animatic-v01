name: S02-A Video Registration Verification V001
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p03-s02-a-video-registration-verification-v001.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify canonical video against video index
        shell: python
        run: |
          from pathlib import Path
          import json, hashlib, subprocess, math

          VIDEO_ID="S02_A_ASSEMBLY_V001"
          PATH="production/video/approved/s02_a/S02_A_ASSEMBLY_APPROVED_V001.mp4"
          EXPECT_SHA="937008e11d20892ea0a17be64719a19cb131d174871930bc29004a678bb58ed1"
          EXPECT_BLOB="bcd3fef7a8d600c95cb4d7242d411cc0df41859c"
          EXPECT_BYTES=6822004

          p=Path(PATH)
          assert p.exists(), "CANONICAL_FILE_MISSING"
          b=p.read_bytes()
          assert len(b)==EXPECT_BYTES, f"BYTE_SIZE_MISMATCH {len(b)}"
          assert hashlib.sha256(b).hexdigest()==EXPECT_SHA, "SHA256_MISMATCH"
          blob=subprocess.check_output(["git","hash-object",PATH],text=True).strip()
          assert blob==EXPECT_BLOB, f"GIT_BLOB_MISMATCH {blob}"

          rows=[json.loads(x) for x in Path("production/video/video_index.jsonl").read_text().splitlines() if x.strip()]
          hits=[r for r in rows if r.get("video_id")==VIDEO_ID]
          assert len(hits)==1, f"VIDEO_INDEX_CARDINALITY_FAIL {len(hits)}"
          r=hits[0]

          assert r["canonical_path"]==PATH, "INDEX_PATH_MISMATCH"
          assert r["sha256"]==EXPECT_SHA, "INDEX_SHA_MISMATCH"
          assert r["git_blob"]==EXPECT_BLOB, "INDEX_BLOB_MISMATCH"
          assert r["byte_size"]==EXPECT_BYTES, "INDEX_BYTE_SIZE_MISMATCH"
          assert r["width"]==942 and r["height"]==1672, "INDEX_DIMENSION_MISMATCH"
          assert r["fps"]==30, "INDEX_FPS_MISMATCH"
          assert r["video_codec"]=="h264", "INDEX_VIDEO_CODEC_MISMATCH"
          assert r["pixel_format"]=="yuv420p", "INDEX_PIXEL_FORMAT_MISMATCH"
          assert r["audio_codec"]=="aac", "INDEX_AUDIO_CODEC_MISMATCH"
          assert r["audio_sample_rate"]==48000, "INDEX_AUDIO_RATE_MISMATCH"
          assert r["audio_channels"]==2, "INDEX_AUDIO_CHANNELS_MISMATCH"
          assert abs(float(r["container_duration_sec"])-45.73) <= 0.002, "INDEX_DURATION_MISMATCH"
          assert r["shot_sequence"]==["N11","N12","A04","N14","N15","A05"], "INDEX_SEQUENCE_MISMATCH"
          assert r["approval_status"]=="APPROVED", "APPROVAL_STATUS_FAIL"
          assert r["approved_by"]=="PRODUCT_OWNER", "APPROVAL_AUTHORITY_FAIL"
          assert r["lifecycle"]=="CURRENT", "LIFECYCLE_FAIL"
          assert r["exact_binary_no_reencode"] is True, "EXACT_BINARY_FLAG_FAIL"

          def probe(args):
              return subprocess.check_output(["ffprobe","-v","error"]+args+[PATH],text=True).strip()

          assert probe(["-select_streams","v:0","-show_entries","stream=width","-of","csv=p=0"])=="942"
          assert probe(["-select_streams","v:0","-show_entries","stream=height","-of","csv=p=0"])=="1672"
          assert probe(["-select_streams","v:0","-show_entries","stream=pix_fmt","-of","csv=p=0"])=="yuv420p"
          assert probe(["-select_streams","v:0","-show_entries","stream=codec_name","-of","csv=p=0"])=="h264"
          assert probe(["-select_streams","v:0","-show_entries","stream=r_frame_rate","-of","csv=p=0"])=="30/1"
          assert probe(["-select_streams","a:0","-show_entries","stream=codec_name","-of","csv=p=0"])=="aac"
          assert probe(["-select_streams","a:0","-show_entries","stream=sample_rate","-of","csv=p=0"])=="48000"
          assert probe(["-select_streams","a:0","-show_entries","stream=channels","-of","csv=p=0"])=="2"
          dur=float(probe(["-show_entries","format=duration","-of","csv=p=0"]))
          assert abs(dur-45.73) <= 0.002, f"MEDIA_DURATION_MISMATCH {dur}"

          subprocess.check_call(["ffmpeg","-v","error","-i",PATH,"-map","0:v:0","-f","null","-"])
          subprocess.check_call(["ffmpeg","-v","error","-i",PATH,"-map","0:a:0","-f","null","-"])

          assert not Path("S02_A_ASSEMBLY_PROOF_V002_COMPAT.mp4").exists(), "STAGING_ROOT_FILE_NOT_CLEANED"

          print("VIDEO_ID="+VIDEO_ID)
          print("SHA_MATCH=YES")
          print("BLOB_MATCH=YES")
          print("INDEX_MATCH=YES")
          print("BYTE_SIZE_MATCH=YES")
          print("MEDIA_METADATA_MATCH=YES")
          print("APPROVAL_LIFECYCLE_MATCH=YES")
          print("FULL_VIDEO_DECODE=PASS")
          print("FULL_AUDIO_DECODE=PASS")
          print("STAGING_CLEANUP_PASS")
          print("OVERALL_RESULT=PASS")
