name: S02-B Audio Boundary Analysis V001
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/p03-s02-b-audio-boundary-analysis-v001.yml

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify canonical source and extract analysis window
        run: |
          mkdir -p S02_B_AUDIO_BOUNDARY_ANALYSIS_V001
          SRC="staging/p0_3_a01_a02_transition_validation/AUDIO_MVP1_CANONICAL_V001.m4a"
          test -f "$SRC"
          test "$(stat -c%s "$SRC")" = "4957338"
          test "$(sha256sum "$SRC" | cut -d' ' -f1)" = "8d0d12d3af5e2c15032912605c0d1b3f3e892fe24918a7064864b136987737a0"

          ffmpeg -hide_banner -loglevel error -i "$SRC"             -af "atrim=start=78.750:end=150.000,asetpts=PTS-STARTPTS"             -c:a pcm_s16le -ar 44100 -ac 2             S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/S02_B_ANALYSIS_0118750_0230000.wav

          ffprobe -v error -show_entries format=duration,size             -of default=nw=1             S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/S02_B_ANALYSIS_0118750_0230000.wav             | tee S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/media.txt

          sha256sum S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/S02_B_ANALYSIS_0118750_0230000.wav             | tee S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/sha256.txt

          ffmpeg -v error -i S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/S02_B_ANALYSIS_0118750_0230000.wav -f null -

          ffmpeg -hide_banner -i "$SRC" -af silencedetect=noise=-38dB:d=0.12 -f null - 2>&1             | grep silencedetect             | awk '$0 ~ /silence_(start|end)/'             | tee S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/silence_detect.txt || true

          {
            echo "SOURCE_SHA_MATCH=YES"
            echo "SOURCE_BYTE_SIZE_MATCH=YES"
            echo "ANALYSIS_WINDOW=00:01:18.750-->00:02:30.000"
            echo "FULL_DECODE=PASS"
          } > S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/qc.txt

      - name: Install speech alignment runtime
        run: pip install -q faster-whisper

      - name: Generate word-level alignment around S02-B
        shell: python
        run: |
          from faster_whisper import WhisperModel
          import json, pathlib

          src = "staging/p0_3_a01_a02_transition_validation/AUDIO_MVP1_CANONICAL_V001.m4a"
          out = pathlib.Path("S02_B_AUDIO_BOUNDARY_ANALYSIS_V001")
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = model.transcribe(
              src,
              language="zh",
              word_timestamps=True,
              vad_filter=False,
              beam_size=5,
          )

          segments = []
          words = []
          for s in segs:
              if s.end < 75 or s.start > 152:
                  continue
              segments.append({
                  "start": round(s.start, 3),
                  "end": round(s.end, 3),
                  "text": s.text.strip(),
              })
              for w in (s.words or []):
                  if w.start is not None and 75 <= w.start <= 152:
                      words.append({
                          "start": round(w.start, 3),
                          "end": round(w.end, 3),
                          "word": w.word,
                      })

          (out / "segments.json").write_text(
              json.dumps(segments, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (out / "words.json").write_text(
              json.dumps(words, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          for s in segments:
              print(f'{s["start"]:07.3f}-{s["end"]:07.3f} {s["text"]}')
          print("WORD_TIMESTAMP_ALIGNMENT_COMPLETE")

      - uses: actions/upload-artifact@v4
        with:
          name: S02_B_AUDIO_BOUNDARY_ANALYSIS_V001
          path: S02_B_AUDIO_BOUNDARY_ANALYSIS_V001/
          retention-days: 7
          if-no-files-found: error
