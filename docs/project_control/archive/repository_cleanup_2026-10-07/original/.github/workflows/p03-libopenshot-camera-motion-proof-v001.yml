name: P03 libopenshot Camera Motion Proof V001

on:
  push:
    branches: [main]
    paths:
      - 'openshot-camera-motion-proof-v001/**'
      - '.github/workflows/p03-libopenshot-camera-motion-proof-v001.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p03-libopenshot-camera-motion-proof-v001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install libopenshot and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common ffmpeg
          sudo add-apt-repository -y ppa:openshot.developers/ppa
          sudo apt-get update
          sudo apt-get install -y python3-openshot
          python3 - <<'PY'
          import openshot
          print("LIBOPENSHOT_IMPORT=PASS")
          print("LIBOPENSHOT_VERSION=", getattr(openshot, "OPENSHOT_VERSION", "UNKNOWN"))
          required = ["Timeline","Clip","QtImageReader","Keyframe","Fraction","BEZIER","SCALE_CROP","GRAVITY_CENTER"]
          missing = [x for x in required if not hasattr(openshot, x)]
          if missing:
              raise SystemExit("Missing libopenshot symbols: " + ",".join(missing))
          print("LIBOPENSHOT_SYMBOLS=PASS")
          PY
          ffmpeg -version
          ffprobe -version

      - name: Verify canonical inputs
        run: python3 openshot-camera-motion-proof-v001/scripts/prepare_inputs.py

      - name: Render motion proof frames with libopenshot
        run: python3 openshot-camera-motion-proof-v001/scripts/build_proof.py

      - name: Encode MP4
        run: |
          mkdir -p openshot-camera-motion-proof-v001/out/P03_LIBOPENSHOT_CAMERA_MOTION_PROOF_V001
          ffmpeg -y             -framerate 30             -i openshot-camera-motion-proof-v001/work/frames/frame_%04d.png             -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 30             -movflags +faststart             openshot-camera-motion-proof-v001/out/P03_LIBOPENSHOT_CAMERA_MOTION_PROOF_V001/P03_LIBOPENSHOT_CAMERA_MOTION_PROOF_V001.mp4
          cp openshot-camera-motion-proof-v001/work/motion_manifest.json             openshot-camera-motion-proof-v001/out/P03_LIBOPENSHOT_CAMERA_MOTION_PROOF_V001/motion_manifest.json

      - name: Technical QC
        run: python3 openshot-camera-motion-proof-v001/scripts/qc_output.py

      - name: Upload motion proof
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: P03_LIBOPENSHOT_CAMERA_MOTION_PROOF_V001
          path: openshot-camera-motion-proof-v001/out/P03_LIBOPENSHOT_CAMERA_MOTION_PROOF_V001/
          retention-days: 7
          if-no-files-found: error

      - name: Record artifact identity
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT_URL=$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
