name: N21 Door Identity Reference V001 Determinism Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_n21_castle_entrance_door_identity_reference_v001.py"
      - "production/controlled_references/n21/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.crop_plan.json"
      - ".github/workflows/n21-door-identity-reference-v001-determinism.yml"

permissions:
  contents: read

jobs:
  two-run-proof:
    runs-on: ubuntu-latest
    env:
      CROP_PLAN: production/controlled_references/n21/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.crop_plan.json
      BUILD_DIR: n21_door_identity_build
      PILLOW_VERSION: "11.3.0"

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up pinned Python minor
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pinned Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow==${PILLOW_VERSION}"
          python --version
          python -c 'import PIL; print("Pillow", PIL.__version__)'

      - name: Build A
        run: |
          mkdir -p "${BUILD_DIR}/run_a"
          python scripts/build_n21_castle_entrance_door_identity_reference_v001.py \
            --crop-plan "${CROP_PLAN}" \
            --output "${BUILD_DIR}/run_a/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.png" \
            --report "${BUILD_DIR}/run_a/build_report.json"

      - name: Build B
        run: |
          mkdir -p "${BUILD_DIR}/run_b"
          python scripts/build_n21_castle_entrance_door_identity_reference_v001.py \
            --crop-plan "${CROP_PLAN}" \
            --output "${BUILD_DIR}/run_b/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.png" \
            --report "${BUILD_DIR}/run_b/build_report.json"

      - name: Verify two-run byte identity
        id: proof
        shell: bash
        run: |
          A="${BUILD_DIR}/run_a/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.png"
          B="${BUILD_DIR}/run_b/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.png"

          SHA_A="$(sha256sum "$A" | awk '{print $1}')"
          SHA_B="$(sha256sum "$B" | awk '{print $1}')"
          BYTES_A="$(wc -c < "$A" | tr -d ' ')"
          BYTES_B="$(wc -c < "$B" | tr -d ' ')"

          echo "RUN_A_SHA256=$SHA_A"
          echo "RUN_B_SHA256=$SHA_B"
          echo "RUN_A_BYTES=$BYTES_A"
          echo "RUN_B_BYTES=$BYTES_B"

          test "$SHA_A" = "$SHA_B"
          test "$BYTES_A" = "$BYTES_B"
          cmp -s "$A" "$B"

          echo "TWO_RUN_BYTE_IDENTITY=PASS"
          echo "output_sha256=$SHA_A" >> "$GITHUB_OUTPUT"
          echo "output_bytes=$BYTES_A" >> "$GITHUB_OUTPUT"

      - name: Verify locked dimensions and source provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p = Path("n21_door_identity_build/run_a/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.png")
          with Image.open(p) as im:
              assert im.size == (160, 1210), im.size
              assert im.mode == "RGB", im.mode
          report = json.loads(Path("n21_door_identity_build/run_a/build_report.json").read_text())
          assert report["source_sha256"] == "d49af6a5e42d0867f2ffe4883e6af82f4d3777da3e96d788924cee2a9c743961"
          assert report["source_bytes"] == 2305753
          assert report["crop_box_ltrb"] == [640, 130, 800, 1340]
          print("LOCKED_CROP_AND_SOURCE_VERIFICATION=PASS")
          PY

      - name: Write proof manifest
        env:
          OUTPUT_SHA256: ${{ steps.proof.outputs.output_sha256 }}
          OUTPUT_BYTES: ${{ steps.proof.outputs.output_bytes }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          import PIL

          crop = Path(os.environ["CROP_PLAN"])
          out = Path(os.environ["BUILD_DIR"])
          report = {
              "schema_version":"1.0",
              "reference_id":"N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001",
              "status":"TWO_RUN_BYTE_IDENTITY_PASS",
              "github_run_id":os.environ["GITHUB_RUN_ID"],
              "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "github_sha":os.environ["GITHUB_SHA"],
              "python_version":platform.python_version(),
              "pillow_version":PIL.__version__,
              "crop_plan_path":crop.as_posix(),
              "crop_plan_sha256":hashlib.sha256(crop.read_bytes()).hexdigest(),
              "source_asset_id":"AST_IMG_000052",
              "source_sha256":"d49af6a5e42d0867f2ffe4883e6af82f4d3777da3e96d788924cee2a9c743961",
              "crop_box_ltrb":[640,130,800,1340],
              "output_width":160,
              "output_height":1210,
              "run_a_sha256":os.environ["OUTPUT_SHA256"],
              "run_b_sha256":os.environ["OUTPUT_SHA256"],
              "run_a_bytes":int(os.environ["OUTPUT_BYTES"]),
              "run_b_bytes":int(os.environ["OUTPUT_BYTES"]),
              "byte_identity":True,
              "canonical_publication_authorized":False,
              "bundle_v007_authorized":False,
              "candidate_09_generation_authorized":False
          }
          (out / "determinism_proof.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          PY

      - name: Copy locked crop plan into proof artifact
        run: |
          cp "${CROP_PLAN}" "${BUILD_DIR}/N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001.crop_plan.json"

      - name: Upload two-run proof
        uses: actions/upload-artifact@v4
        with:
          name: N21_CASTLE_ENTRANCE_DOOR_IDENTITY_REFERENCE_V001_TWO_RUN_PROOF
          path: n21_door_identity_build/
          retention-days: 7
          if-no-files-found: error
